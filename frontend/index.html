<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pálpito — Diagnóstico Financiero</title>
<style>
  /* ==========================================================================
     PÁLPITO — instrumento de registro de precisión
     Retícula milimetrada, trazo de aguja entintada, escalas calibradas.
     Dos calibraciones: pantalla (por defecto) y proyector (alto contraste).
     ========================================================================== */

  :root{
    /* Grafito azulado: la carcasa del instrumento, no negro puro. */
    --fondo:#0d1219;
    --panel:#141b25;
    --hondo:#0a0e14;
    --borde:#232d3b;
    --borde-vivo:#31405360;

    /* Retícula milimetrada: dos densidades, como el papel de registro. */
    --grid-fino:#ffffff07;
    --grid-grueso:#ffffff0d;

    --texto:#e7ecf3;
    --suave:#a3b1c4;
    --tenue:#71809a;

    /* Tintas del instrumento: cálidas y entintadas, nunca neón frío. */
    --aguja:#e8a33d;        /* el trazo principal */
    --aguja-tenue:#e8a33d24;
    --tinta-mal:#e8615a;    /* tinta roja de alarma */
    --tinta-bien:#5cb98a;   /* verde fósforo apagado */
    --tinta-ojo:#d9a441;    /* ámbar de advertencia */
    --tinta-dato:#5b90c9;   /* azul de anotación */

    --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;

    /* Escala fija (Operate): razón 1,2. Nada fluido. */
    --t-micro:10.5px; --t-mini:11.5px; --t-pie:12.5px; --t-cuerpo:14px;
    --t-medio:15px;   --t-sub:17px;    --t-tit:20px;   --t-gran:26px;

    --r:10px;   /* radio único */
    --r-chico:6px;

    /* Sombras con desplazamiento y difuminado real, no halos. */
    --sombra:0 1px 2px #00000038;
    --sombra-alta:0 4px 10px #0000004d, 0 18px 46px #00000040;

    --transicion:180ms cubic-bezier(.2,.7,.3,1);
  }

  /* Calibración de proyector: un salón con luz lava los negros. */
  html[data-cal="proyector"]{
    --fondo:#f4f6f9; --panel:#ffffff; --hondo:#eaeef4;
    --borde:#c3ccd9; --borde-vivo:#9aa8bb80;
    --grid-fino:#0d121908; --grid-grueso:#0d121912;
    --texto:#101822; --suave:#3d4b5e; --tenue:#5d6b80;
    --aguja:#a35f07; --aguja-tenue:#a35f0718;
    --tinta-mal:#b3261e; --tinta-bien:#1d6b47; --tinta-ojo:#8a5a06; --tinta-dato:#1d4f86;
    --sombra:0 1px 2px #0d121914, 0 4px 12px #0d12190f;
    --sombra-alta:0 2px 6px #0d12191f, 0 12px 30px #0d121914;
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
      transition-duration:.01ms!important;scroll-behavior:auto!important}
  }

  *{box-sizing:border-box}

  /* La retícula del papel de registro, bajo todo el documento. */
  body{
    margin:0;color:var(--texto);font-family:var(--sans);
    font-size:var(--t-cuerpo);line-height:1.55;
    -webkit-font-smoothing:antialiased;background-color:var(--fondo);
  }

  /* El papel milimetrado no es tapiz: solo aparece bajo lo que se mide.
     Va en un pseudo-elemento porque enmascarar el elemento entero
     desvanece tambien su texto. */
  .reticula{position:relative;isolation:isolate}
  .reticula::before{
    content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
    background-image:
      linear-gradient(var(--grid-fino) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid-fino) 1px,transparent 1px),
      linear-gradient(var(--grid-grueso) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid-grueso) 1px,transparent 1px);
    background-size:12px 12px,12px 12px,60px 60px,60px 60px;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 14% 86%,transparent);
            mask-image:linear-gradient(90deg,transparent,#000 14% 86%,transparent);
  }

  /* Superficies del navegador: también son parte del instrumento. */
  ::selection{background:var(--aguja);color:var(--fondo)}
  html{scrollbar-color:var(--borde) transparent;scrollbar-width:thin;accent-color:var(--aguja)}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--borde);border-radius:6px;
    border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--tenue);background-clip:content-box}
  :focus-visible{outline:2px solid var(--aguja);outline-offset:2px;border-radius:3px}
  a{color:var(--aguja);text-underline-offset:3px;text-decoration-thickness:1px}

  /* Cifras siempre tabulares: las columnas de números deben alinearse. */
  .cif,.valores,td.num,.puente,table,input,.mono{font-variant-numeric:tabular-nums}

  .envoltura{max-width:1200px;margin:0 auto;padding:0 20px 90px}
  /* Solo las tablas y el codigo pueden ser mas anchos, cada uno con su
     propio desplazamiento; el cuerpo de la pagina nunca. */
  .prosa,.leyenda,.detalle,p,li,h2,h3,h4{overflow-wrap:break-word}

  /* ------------------------------------------------------ cabecera fija */

  header.principal{
    position:sticky;top:0;z-index:40;margin:0 -20px 26px;padding:11px 20px;
    background:color-mix(in srgb,var(--fondo) 86%,transparent);
    backdrop-filter:blur(14px) saturate(140%);
    border-bottom:1px solid var(--borde);
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .marca{display:flex;align-items:baseline;gap:10px;flex:none}
  .marca h1{margin:0;font-size:var(--t-sub);letter-spacing:-.02em;font-weight:650}
  .marca .pulso{
    width:26px;height:12px;flex:none;overflow:visible;
  }
  .marca .pulso path{fill:none;stroke:var(--aguja);stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  .cab-empresa{display:flex;align-items:baseline;gap:9px;min-width:0;flex:1}
  .cab-empresa .nom{font-weight:600;color:var(--texto);font-size:var(--t-medio);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cab-empresa .per{font-family:var(--mono);font-size:var(--t-mini);color:var(--tenue);
    white-space:nowrap}
  .cab-estado{display:flex;align-items:center;gap:7px;font-size:var(--t-mini);
    font-family:var(--mono);color:var(--suave);white-space:nowrap}
  .cab-estado .pip{width:7px;height:7px;border-radius:50%;background:var(--tenue);flex:none}
  .cab-estado.verde .pip{background:var(--tinta-bien)}
  .cab-estado.amarillo .pip{background:var(--tinta-ojo)}
  .cab-estado.rojo .pip{background:var(--tinta-mal)}

  .epigrafe{
    border-left:1px solid var(--borde);padding:14px 0 18px 16px;margin:0 0 4px;
    color:var(--tenue);font-size:var(--t-pie);line-height:1.6;max-width:62ch;
  }
  .epigrafe b{color:var(--suave);font-weight:600}
  .epigrafe cite{display:block;margin-top:5px;font-style:normal;font-size:var(--t-mini)}

  /* --------------------------------------------------------- controles */

  .barra{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:0 0 22px}
  button,select{
    background:var(--panel);color:var(--texto);border:1px solid var(--borde);
    border-radius:var(--r-chico);padding:8px 14px;font-size:var(--t-pie);
    cursor:pointer;font-family:inherit;transition:border-color var(--transicion),
      background var(--transicion),color var(--transicion);
  }
  button:hover:not(:disabled),select:hover{border-color:var(--aguja);color:var(--texto)}
  button:active:not(:disabled){transform:translateY(.5px)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primario{background:var(--aguja);color:#180f02;border-color:var(--aguja);font-weight:650}
  html[data-cal="proyector"] button.primario{color:#fff}
  /* Repite el color: el hover generico tiene mas especificidad y se lo llevaba,
     dejando texto claro sobre ambar (1,8:1). */
  button.primario:hover:not(:disabled){filter:brightness(1.08);color:#180f02}
  html[data-cal="proyector"] button.primario:hover:not(:disabled){color:#fff}
  label.interruptor{display:flex;align-items:center;gap:7px;color:var(--suave);
    font-size:var(--t-pie);cursor:pointer;user-select:none}
  .barra .derecha{margin-left:auto;display:flex;gap:9px;align-items:center}

  /* ---------------------------------------------------------- secciones */

  section{margin:0 0 40px;scroll-margin-top:70px}
  h2{font-size:var(--t-tit);margin:0 0 3px;letter-spacing:-.015em;font-weight:650;
    text-wrap:balance}
  .leyenda{color:var(--tenue);font-size:var(--t-pie);margin:0 0 16px;max-width:70ch}

  /* Regla de sección: la marca de calibración del papel de registro. */
  .regla{display:flex;align-items:center;gap:12px;margin:0 0 14px}
  .regla::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,
    var(--borde),transparent)}

  .tarjeta{background:var(--panel);border:1px solid var(--borde);
    border-radius:var(--r);padding:18px}

  /* ------------------------------------------------------ el dictamen */

  .dictamen{
    display:grid;grid-template-columns:minmax(0,1fr) auto;gap:34px;align-items:center;
    padding:24px 0 26px;border-top:1px solid var(--borde);
    border-bottom:1px solid var(--borde);margin-bottom:34px;
  }
  .dictamen .veredicto{min-width:0}
  .dictamen .rotulo{font-family:var(--mono);font-size:var(--t-micro);
    letter-spacing:.16em;text-transform:uppercase;color:var(--tenue);margin-bottom:9px}
  .dictamen .banda{font-size:var(--t-gran);font-weight:680;letter-spacing:-.025em;
    margin:0 0 8px;line-height:1.15;text-wrap:balance}
  .dictamen .banda.verde{color:var(--tinta-bien)}
  .dictamen .banda.amarillo{color:var(--tinta-ojo)}
  .dictamen .banda.rojo{color:var(--tinta-mal)}
  .dictamen .rango-banda{font-family:var(--mono);font-size:var(--t-mini);
    color:var(--tenue);margin-bottom:10px}
  .dictamen p{margin:0;color:var(--suave);font-size:var(--t-cuerpo);max-width:56ch}
  .dictamen .aguja-caja{flex:none}

  /* Aguja del puntaje: el instrumento marcando sobre su escala. */
  .medidor{width:206px;height:126px;display:block}
  .medidor .arco-pista{fill:none;stroke:var(--hondo);stroke-width:9;stroke-linecap:round}
  .medidor .arco-vivo{fill:none;stroke-width:9;stroke-linecap:round;
    transition:stroke-dashoffset 900ms cubic-bezier(.2,.7,.25,1)}
  .medidor .marca{stroke:var(--borde);stroke-width:1}
  .medidor .marca.mayor{stroke:var(--tenue)}
  .medidor .rot{font-family:var(--mono);font-size:8.5px;fill:var(--tenue)}
  .medidor .cifra{font-family:var(--mono);font-size:34px;font-weight:700;
    fill:var(--texto);font-variant-numeric:tabular-nums}
  .medidor .de{font-family:var(--mono);font-size:10px;fill:var(--tenue)}
  .medidor .puntero{stroke:var(--texto);stroke-width:1.6;stroke-linecap:round}

  .sello-confianza{display:inline-flex;align-items:center;gap:7px;margin-top:12px;
    font-family:var(--mono);font-size:var(--t-mini);padding:4px 10px;
    border-radius:var(--r-chico);border:1px solid var(--tinta-ojo);
    background:color-mix(in srgb,var(--tinta-ojo) 10%,transparent);color:var(--tinta-ojo)}

  /* ------------------------------------------------------- tooltips */

  .ayuda{
    display:inline-grid;place-items:center;width:15px;height:15px;flex:none;
    border:1px solid var(--borde);border-radius:50%;background:transparent;
    color:var(--tenue);font-size:9.5px;font-family:var(--mono);font-weight:700;
    cursor:help;padding:0;vertical-align:middle;margin-left:5px;
    transition:color var(--transicion),border-color var(--transicion);
  }
  .ayuda:hover,.ayuda:focus-visible{color:var(--aguja);border-color:var(--aguja)}
  .globo{
    position:fixed;z-index:90;max-width:330px;pointer-events:none;
    background:var(--panel);border:1px solid var(--borde-vivo);
    border-radius:var(--r);padding:13px 15px;box-shadow:var(--sombra-alta);
    font-size:var(--t-pie);line-height:1.55;color:var(--suave);
    opacity:0;transform:translateY(4px);transition:opacity 140ms ease-out,transform 140ms ease-out;
  }
  .globo.visible{opacity:1;transform:translateY(0)}
  .globo .g-tit{color:var(--texto);font-weight:650;font-size:var(--t-cuerpo);
    margin-bottom:6px;display:block}
  .globo .g-formula{font-family:var(--mono);font-size:var(--t-mini);color:var(--aguja);
    background:var(--hondo);border-radius:var(--r-chico);padding:6px 9px;margin:9px 0 0;
    display:block;overflow-wrap:anywhere}
  .globo .g-criterio{margin-top:9px;padding-top:9px;border-top:1px solid var(--borde);
    font-size:var(--t-mini)}
  .globo .g-criterio b{color:var(--texto);font-weight:600}
  .globo .g-fuente{margin-top:8px;font-size:var(--t-micro);color:var(--tenue);font-style:italic}

  /* ---------------------------------------------------- calidad de datos */

  .semaforo{border-top:2px solid var(--borde)}
  .semaforo.rojo{border-top-color:var(--tinta-mal)}
  .semaforo.amarillo{border-top-color:var(--tinta-ojo)}
  .semaforo.verde{border-top-color:var(--tinta-bien)}
  .semaforo h3{margin:0 0 12px;font-size:var(--t-medio);font-weight:600}
  .conteos{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:16px;font-size:var(--t-mini);
    color:var(--tenue)}
  .conteos b{font-size:var(--t-tit);display:block;font-family:var(--mono);
    color:var(--texto);font-weight:650;line-height:1.2}
  .hallazgo{border-top:1px solid var(--borde);padding:12px 0;font-size:var(--t-pie)}
  .hallazgo:last-child{padding-bottom:0}
  .etiqueta{font-size:var(--t-micro);font-weight:700;letter-spacing:.09em;padding:2px 7px;
    border-radius:4px;margin-right:8px;text-transform:uppercase;font-family:var(--mono)}
  .etiqueta.error{background:color-mix(in srgb,var(--tinta-mal) 15%,transparent);color:var(--tinta-mal)}
  .etiqueta.advertencia{background:color-mix(in srgb,var(--tinta-ojo) 15%,transparent);color:var(--tinta-ojo)}
  .etiqueta.info{background:color-mix(in srgb,var(--tinta-dato) 15%,transparent);color:var(--tinta-dato)}
  .detalle{color:var(--tenue);font-size:var(--t-mini);margin-top:5px}

  /* -------------------------------------------------------------- alertas */

  .alerta{background:var(--panel);border:1px solid var(--borde);border-radius:var(--r);
    padding:16px 18px;margin-bottom:10px;display:flex;gap:15px}
  .alerta .rank{flex:none;width:27px;height:27px;border-radius:var(--r-chico);display:grid;
    place-items:center;font-weight:700;font-size:var(--t-pie);background:var(--hondo);
    border:1px solid var(--borde);color:var(--tenue);font-family:var(--mono)}
  .alerta.top .rank{background:color-mix(in srgb,var(--tinta-mal) 14%,transparent);
    border-color:var(--tinta-mal);color:var(--tinta-mal)}
  .alerta h4{margin:1px 0 7px;font-size:var(--t-medio);font-weight:600}
  .alerta p{margin:0 0 11px;color:var(--suave);font-size:var(--t-pie);max-width:72ch}
  .fuentes{background:var(--hondo);border-radius:var(--r-chico);padding:9px 12px;
    font-family:var(--mono);font-size:var(--t-mini);color:var(--suave)}
  .fuentes div{padding:2px 0}
  .fuentes .rotulo{color:var(--tenue);font-size:var(--t-micro);letter-spacing:.1em;
    text-transform:uppercase;margin-bottom:5px}

  /* --------------------------------------------------------- indicadores */

  .rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:10px}
  .ind{background:var(--panel);border:1px solid var(--borde);border-radius:var(--r);
    padding:14px;transition:border-color var(--transicion),box-shadow var(--transicion)}
  .ind:hover{border-color:var(--borde-vivo)}
  .ind .nom{font-size:var(--t-pie);color:var(--suave);margin-bottom:10px;min-height:34px;
    display:flex;align-items:flex-start;gap:2px}
  .valores{display:flex;align-items:baseline;gap:9px;font-family:var(--mono)}
  .v{font-size:var(--t-tit);font-weight:650;letter-spacing:-.01em}
  .v.nd{font-size:var(--t-pie);color:var(--tenue);font-weight:400;font-family:var(--sans)}
  .flecha{color:var(--tenue);font-size:var(--t-pie)}
  .delta{font-size:var(--t-mini);margin-left:auto;font-family:var(--mono)}
  .sube{color:var(--tinta-bien)} .baja{color:var(--tinta-mal)} .neutro{color:var(--tenue)}

  .docencia{display:none;margin-top:12px;padding-top:12px;
    border-top:1px solid var(--borde);font-size:var(--t-mini);color:var(--suave)}
  body.docente .docencia{display:block}
  .docencia code{font-family:var(--mono);color:var(--aguja);font-size:var(--t-mini)}
  .docencia .campo{margin-bottom:6px}
  .docencia .campo b{color:var(--tenue);font-weight:600;font-size:var(--t-micro);
    text-transform:uppercase;letter-spacing:.09em;display:block;font-family:var(--mono)}

  /* ------------------------------------------------------------- tablas */

  table{width:100%;border-collapse:collapse;font-size:var(--t-pie)}
  th,td{padding:8px 11px;text-align:right;border-bottom:1px solid var(--borde)}
  th:first-child,td:first-child{text-align:left}
  thead th{color:var(--tenue);font-size:var(--t-micro);text-transform:uppercase;
    letter-spacing:.1em;font-weight:600;font-family:var(--mono)}
  tbody tr:hover{background:color-mix(in srgb,var(--texto) 3%,transparent)}
  td.num{font-family:var(--mono)}
  /* Doble raya bajo el total, como en un estado financiero. */
  tr.total td{border-top:1px solid var(--borde);border-bottom:3px double var(--borde);
    font-weight:650;color:var(--texto)}
  .desplazable{overflow-x:auto;border-radius:var(--r-chico)}

  /* -------------------------------------------------------- puente de caja */

  .puente{font-family:var(--mono);font-size:var(--t-cuerpo)}
  .puente .fila{display:flex;justify-content:space-between;gap:16px;padding:9px 0;
    border-bottom:1px solid var(--borde)}
  .puente .fila.total{border-top:1px solid var(--aguja);border-bottom:3px double var(--aguja);
    margin-top:6px;padding-top:12px;font-weight:700;font-size:var(--t-medio)}
  .puente .fila.eco{border:none;color:var(--tenue);font-size:var(--t-pie);padding:4px 0}
  .aviso{background:color-mix(in srgb,var(--tinta-ojo) 8%,transparent);
    border:1px solid color-mix(in srgb,var(--tinta-ojo) 32%,transparent);
    border-radius:var(--r-chico);padding:10px 13px;font-size:var(--t-mini);
    color:var(--tinta-ojo);margin-top:14px}

  /* ---------------------------------------------------------- importador */

  #importador{display:none;margin-bottom:20px}
  #importador.abierto{display:block}
  .soltar{border:1px dashed var(--borde);border-radius:var(--r);padding:28px 20px;
    text-align:center;color:var(--suave);
    transition:border-color var(--transicion),background var(--transicion)}
  .soltar.encima{border-color:var(--aguja);background:var(--aguja-tenue)}
  .soltar b{color:var(--texto);display:block;margin-bottom:5px;font-size:var(--t-medio)}
  .soltar .formatos{color:var(--tenue);font-size:var(--t-mini);margin-top:9px;font-family:var(--mono)}
  .soltar button{margin-top:14px}
  .paginas-pdf{display:block;margin-top:18px;padding-top:16px;
    border-top:1px solid var(--borde);text-align:left;max-width:52ch;
    margin-inline:auto}
  .paginas-pdf span{display:block;font-size:var(--t-micro);color:var(--tenue);
    text-transform:uppercase;letter-spacing:.09em;font-family:var(--mono);
    margin-bottom:5px}
  .paginas-pdf input{width:140px;font-family:var(--mono);text-align:center}
  .paginas-pdf em code{font-family:var(--mono);color:var(--aguja)}
  .paginas-pdf em b{color:var(--suave);font-weight:600}
  .paginas-pdf em{display:block;margin-top:7px;font-size:var(--t-micro);
    color:var(--tenue);font-style:normal;line-height:1.5}

  /* Buscar la empresa por su nombre, sin archivo. Va debajo de la zona de
     soltar, como segunda puerta: la primera sigue siendo el archivo, porque
     las de bolsa y las pymes no estan en Supersociedades. */
  .por-nombre{border:1px solid var(--borde);border-radius:var(--r);padding:22px 20px;
    margin-top:14px;color:var(--suave)}
  .por-nombre b{color:var(--texto);display:block;margin-bottom:5px;font-size:var(--t-medio)}
  .por-nombre .nota{font-size:var(--t-mini);color:var(--tenue);line-height:1.55;max-width:70ch}
  .por-nombre form{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .por-nombre form input{flex:1;min-width:200px;padding:9px 12px;font-size:var(--t-cuerpo)}
  .resultados-nombre{margin-top:12px;display:flex;flex-direction:column;gap:4px}
  .resultados-nombre button{display:flex;justify-content:space-between;gap:12px;
    width:100%;text-align:left;padding:9px 12px;font-size:var(--t-mini);
    border-radius:var(--r-chico)}
  .resultados-nombre button .nit{font-family:var(--mono);color:var(--tenue);white-space:nowrap}
  .resultados-nombre .vacio{font-size:var(--t-mini);color:var(--tenue);padding:8px 2px;line-height:1.55}

  .imp-cabeza{display:flex;justify-content:space-between;align-items:baseline;
    gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .imp-cabeza h3{margin:0;font-size:var(--t-medio);font-weight:600}
  .imp-cabeza .archivo{color:var(--tenue);font-size:var(--t-mini);font-family:var(--mono)}
  .conteo-mapeo{font-size:var(--t-pie);color:var(--suave)}
  .conteo-mapeo b{font-family:var(--mono);color:var(--texto)}

  .imp-meta{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
  .imp-meta label{display:flex;flex-direction:column;gap:4px;font-size:var(--t-micro);
    color:var(--tenue);text-transform:uppercase;letter-spacing:.09em;font-family:var(--mono)}
  input{background:var(--hondo);border:1px solid var(--borde);color:var(--texto);
    border-radius:var(--r-chico);padding:7px 10px;font-size:var(--t-pie);
    font-family:inherit;transition:border-color var(--transicion)}
  input:focus{outline:none;border-color:var(--aguja)}
  input::placeholder{color:var(--tenue)}
  .imp-meta input{min-width:150px}
  .imp-meta input.periodo{min-width:96px;font-family:var(--mono);text-align:center}

  table.mapeo td{vertical-align:middle}
  table.mapeo select{padding:5px 8px;font-size:var(--t-mini);width:100%;max-width:230px}
  table.mapeo .cifra{font-family:var(--mono);font-size:var(--t-mini);color:var(--suave)}
  table.mapeo .etiqueta{max-width:270px;font-family:var(--sans);text-transform:none;
    letter-spacing:normal;font-weight:400;font-size:var(--t-pie);background:none;padding:0}
  table.mapeo .etiqueta .orig{font-size:var(--t-micro);color:var(--tenue);font-family:var(--mono)}
  table.mapeo tr.libre{opacity:.6}
  table.mapeo tr.libre:hover{opacity:1}
  .sello-origen{font-size:var(--t-micro);font-weight:700;letter-spacing:.07em;padding:2px 6px;
    border-radius:4px;text-transform:uppercase;white-space:nowrap;font-family:var(--mono)}
  .sello-origen.diccionario{background:color-mix(in srgb,var(--tinta-dato) 15%,transparent);color:var(--tinta-dato)}
  .sello-origen.modelo{background:var(--aguja-tenue);color:var(--aguja)}
  .sello-origen.usuario{background:color-mix(in srgb,var(--tinta-bien) 15%,transparent);color:var(--tinta-bien)}
  .sello-origen.baja{background:color-mix(in srgb,var(--tinta-mal) 15%,transparent);color:var(--tinta-mal)}
  .imp-acciones{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;
    padding-top:16px;border-top:1px solid var(--borde);align-items:center}
  .imp-acciones .apagado{margin-left:auto}

  /* --------------------------------------------------- puntaje de salud */

  .dims{margin-top:4px}
  .dim{margin-bottom:16px}
  .dim .fila1{display:flex;justify-content:space-between;align-items:baseline;
    gap:10px;font-size:var(--t-pie);margin-bottom:6px}
  .dim .peso{color:var(--tenue);font-size:var(--t-mini);font-family:var(--mono)}
  .dim .nota{font-family:var(--mono);font-weight:650;font-size:var(--t-cuerpo)}
  .dim .riel{height:7px;background:var(--hondo);border-radius:4px;overflow:hidden}
  .dim .relleno{height:100%;border-radius:4px;
    transition:width 900ms cubic-bezier(.2,.7,.25,1)}
  .dim .aporte{color:var(--tenue);font-size:var(--t-mini);font-family:var(--mono);margin-top:5px}

  .criterios{margin-top:6px}
  .criterios details{border-top:1px solid var(--borde);font-size:var(--t-pie)}
  .criterios summary{padding:10px 2px;cursor:pointer;display:flex;
    justify-content:space-between;gap:12px;align-items:baseline;list-style:none}
  .criterios summary::-webkit-details-marker{display:none}
  .criterios summary:hover{color:var(--aguja)}
  .criterios summary .izq::before{content:"";display:inline-block;width:0;height:0;
    border-left:4px solid var(--tenue);border-top:3.5px solid transparent;
    border-bottom:3.5px solid transparent;margin-right:9px;
    transition:transform var(--transicion)}
  .criterios details[open] summary .izq::before{transform:rotate(90deg)}
  .criterios .cifras{font-family:var(--mono);font-size:var(--t-mini);color:var(--suave);
    white-space:nowrap}
  .criterios .cifras b{color:var(--texto);font-size:var(--t-pie)}
  .criterios .cuerpo{padding:4px 2px 18px 18px;color:var(--suave);font-size:var(--t-mini);
    max-width:78ch}
  .criterios .cuerpo .desglose{font-family:var(--mono);color:var(--aguja);
    font-size:var(--t-mini);margin:10px 0}
  .criterios .cuerpo .cita{color:var(--tenue);font-size:var(--t-micro);margin-top:10px;
    font-style:italic}
  .criterios .excluido summary{color:var(--tenue)}
  .escala-svg{width:100%;height:auto;display:block;margin:10px 0 4px;max-width:420px}
  .escala-svg text{font-family:var(--mono);font-size:9.5px;fill:var(--tenue)}

  /* ------------------------------------------------------------ gráficas */

  .graficas{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:10px}
  .graficas h3{margin:0 0 3px;font-size:var(--t-cuerpo);font-weight:600}
  .graficas .pie{color:var(--tenue);font-size:var(--t-mini);margin:0 0 12px;line-height:1.5}
  .grafica{width:100%;height:auto;display:block}
  .grafica text{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .grafica .eje{stroke:var(--borde);stroke-width:1}
  .grafica .malla{stroke:var(--borde);stroke-width:1;stroke-dasharray:2 4;opacity:.55}
  .grafica .rotulo{font-size:10px;fill:var(--tenue)}
  .grafica .valor{font-size:10.5px;fill:var(--texto)}
  .grafica .conector{stroke:var(--tenue);stroke-width:1;stroke-dasharray:2 3;opacity:.6}
  .grafica rect{transition:opacity var(--transicion)}
  .grafica rect:hover{opacity:.8}
  .leyenda-g{display:flex;gap:15px;flex-wrap:wrap;margin-top:11px;font-size:var(--t-mini);
    color:var(--suave)}
  .leyenda-g span{display:inline-flex;align-items:center;gap:6px}
  .leyenda-g i{width:10px;height:10px;border-radius:2px;flex:none}

  /* -------------------------------------------------------------- editor */

  #editor{display:none}
  #editor.abierto{display:block}
  #editor input{width:112px;text-align:right;font-family:var(--mono);font-size:var(--t-pie)}

  /* --------------------------------------------------------- narrativa IA */

  .ia{border-color:var(--borde-vivo)}
  .ia .prosa{font-size:var(--t-medio);line-height:1.68;max-width:70ch}
  .ia .prosa strong{color:var(--aguja);font-weight:650}
  .ia .prosa p{margin:0 0 13px}
  .sello{display:inline-flex;align-items:center;gap:7px;font-size:var(--t-mini);
    color:var(--tenue);border:1px solid var(--borde);border-radius:20px;padding:3px 11px;
    margin-top:15px;font-family:var(--mono)}
  .punto{width:6px;height:6px;border-radius:50%;background:var(--tinta-bien);flex:none}
  .preguntas{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .preguntas button{font-size:var(--t-mini);padding:6px 12px;color:var(--suave)}
  #cajaPregunta{display:flex;gap:8px;margin-top:6px}
  #cajaPregunta input{flex:1;padding:10px 13px;font-size:var(--t-cuerpo)}
  .apagado{color:var(--tenue);font-size:var(--t-pie)}

  .recomendaciones{padding-left:20px}
  .recomendaciones li{margin-bottom:10px;color:var(--suave);font-size:var(--t-cuerpo);
    max-width:72ch}
  .recomendaciones li::marker{color:var(--aguja);font-family:var(--mono)}

  .cargando{color:var(--tenue);padding:56px 20px;text-align:center;font-family:var(--mono);
    font-size:var(--t-pie)}

  footer{margin-top:64px;padding-top:20px;border-top:1px solid var(--borde);
    color:var(--tenue);font-size:var(--t-mini);max-width:78ch}

  /* ================================================ PROYECTO DE INVERSIÓN */

  .pro-entrada{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));
    gap:12px;margin-bottom:18px}
  .pro-entrada label{display:flex;flex-direction:column;gap:5px;
    font-size:var(--t-micro);color:var(--tenue);text-transform:uppercase;
    letter-spacing:.09em;font-family:var(--mono)}
  .pro-entrada input{width:100%;font-family:var(--mono);text-align:right}
  .pro-entrada input.texto{text-align:left;font-family:var(--sans)}

  .pro-flujos{margin:4px 0 18px}
  .pro-flujos .cabeza{display:flex;align-items:baseline;gap:12px;margin-bottom:9px;
    flex-wrap:wrap}
  .pro-flujos .cabeza .rot{font-size:var(--t-micro);color:var(--tenue);
    text-transform:uppercase;letter-spacing:.09em;font-family:var(--mono)}
  .pro-flujos .tira{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
  .pro-flujos .anio{display:flex;flex-direction:column;gap:4px}
  .pro-flujos .anio span{font-size:var(--t-micro);color:var(--tenue);
    font-family:var(--mono);text-align:center}
  .pro-flujos .anio input{width:92px;text-align:right;font-family:var(--mono);
    font-size:var(--t-pie)}

  /* Dictamen del proyecto: mismo instrumento, otra escala. */
  .pro-veredicto{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;
    padding:20px 0;border-top:1px solid var(--borde);border-bottom:1px solid var(--borde);
    margin:20px 0 24px}
  .pro-veredicto .marca-v{flex:none;width:52px;height:52px;border-radius:50%;
    display:grid;place-items:center;border:2px solid var(--borde);position:relative}
  .pro-veredicto .marca-v svg{width:26px;height:26px}
  .pro-veredicto.verde .marca-v{border-color:var(--tinta-bien)}
  .pro-veredicto.amarillo .marca-v{border-color:var(--tinta-ojo)}
  .pro-veredicto.rojo .marca-v{border-color:var(--tinta-mal)}
  .pro-veredicto .texto-v{flex:1;min-width:230px}
  .pro-veredicto .titulo-v{font-size:var(--t-tit);font-weight:680;margin:0 0 6px;
    letter-spacing:-.02em}
  .pro-veredicto.verde .titulo-v{color:var(--tinta-bien)}
  .pro-veredicto.amarillo .titulo-v{color:var(--tinta-ojo)}
  .pro-veredicto.rojo .titulo-v{color:var(--tinta-mal)}
  .pro-veredicto p{margin:0;color:var(--suave);font-size:var(--t-pie);max-width:66ch}
  .pro-veredicto .cuenta{font-family:var(--mono);font-size:var(--t-mini);
    color:var(--tenue);margin-top:8px}

  .pro-metricas{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));
    gap:10px;margin-bottom:24px}
  .pro-met{background:var(--panel);border:1px solid var(--borde);border-radius:var(--r);
    padding:13px 14px;position:relative;overflow:hidden}
  .pro-met::before{content:"";position:absolute;inset:0 auto 0 0;width:2px;
    background:var(--borde)}
  .pro-met.favorable::before{background:var(--tinta-bien)}
  .pro-met.limite::before{background:var(--tinta-ojo)}
  .pro-met.desfavorable::before{background:var(--tinta-mal)}
  .pro-met .m-nom{font-size:var(--t-mini);color:var(--suave);margin-bottom:8px;
    display:flex;align-items:flex-start;gap:2px;min-height:30px}
  .pro-met .m-val{font-family:var(--mono);font-size:var(--t-tit);font-weight:650;
    letter-spacing:-.01em;line-height:1.2}
  .pro-met.favorable .m-val{color:var(--tinta-bien)}
  .pro-met.desfavorable .m-val{color:var(--tinta-mal)}
  .pro-met .m-val.nd{font-size:var(--t-pie);color:var(--tenue);font-family:var(--sans);
    font-weight:400}
  .pro-met .m-crit{font-size:var(--t-micro);color:var(--tenue);margin-top:7px;
    font-family:var(--mono)}

  .pro-lectura{color:var(--suave);font-size:var(--t-pie);margin:0 0 6px;max-width:74ch}

  .escenarios{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));
    gap:10px;margin:12px 0 18px}
  .esc{border:1px solid var(--borde);border-radius:var(--r);padding:13px 14px;
    background:var(--panel)}
  .esc.base{border-color:var(--aguja)}
  .esc .e-nom{font-size:var(--t-mini);color:var(--suave);margin-bottom:3px;
    display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .esc .e-var{font-family:var(--mono);font-size:var(--t-micro);color:var(--tenue)}
  .esc .e-vpn{font-family:var(--mono);font-size:var(--t-sub);font-weight:650}
  .esc .e-vpn.pos{color:var(--tinta-bien)} .esc .e-vpn.neg{color:var(--tinta-mal)}
  .esc .e-pie{font-size:var(--t-micro);color:var(--tenue);margin-top:5px;font-family:var(--mono)}

  .quiebre{border:1px solid var(--borde);border-radius:var(--r);padding:15px 17px;
    background:var(--panel);margin-bottom:22px}
  .quiebre .q-rot{font-family:var(--mono);font-size:var(--t-micro);letter-spacing:.12em;
    text-transform:uppercase;color:var(--tenue);margin-bottom:8px}
  .quiebre .q-cifra{font-family:var(--mono);font-size:var(--t-gran);font-weight:700;
    color:var(--aguja);line-height:1.15;letter-spacing:-.02em}
  .quiebre p{margin:7px 0 0;color:var(--suave);font-size:var(--t-pie);max-width:64ch}

  /* Flujo de caja mensual */
  table.mensual-edit input{width:96px;text-align:right;font-family:var(--mono);
    font-size:var(--t-mini);padding:5px 8px}
  table.mensual-edit td{padding:5px 11px}
  .mensual .mes-neg td{color:var(--tinta-mal)}
  .mensual .mes-neg td:first-child{font-weight:650}
  .barra-caja{height:5px;background:var(--hondo);border-radius:3px;overflow:hidden;
    min-width:56px}
  .barra-caja i{display:block;height:100%;border-radius:3px}

  /* --------------------------------------------------------- responsivo */

  @media (max-width:820px){
    .dictamen{grid-template-columns:1fr;gap:20px;justify-items:start}
    .medidor{width:186px;height:114px}
  }
  @media (max-width:560px){
    :root{--t-gran:22px;--t-tit:18px}
    .envoltura{padding:0 14px 70px}
    header.principal{margin:0 -14px 20px;padding:10px 14px;gap:10px}
    /* El nombre y los periodos venian con nowrap y juntos superaban el ancho
       del telefono, empujando toda la pagina a desplazamiento horizontal. */
    .cab-empresa{order:3;flex-basis:100%;flex-wrap:wrap;gap:4px 9px}
    .cab-empresa .nom,.cab-empresa .per{white-space:normal;overflow:visible}
    .rejilla,.pro-metricas,.escenarios,.graficas{grid-template-columns:1fr}
    .barra .derecha{margin-left:0}
    .globo{max-width:calc(100vw - 28px)}
    .pro-flujos .anio input{width:78px}
  }


  /* ================================================== NAVEGACIÓN POR MÓDULOS */

  .armazon{display:grid;grid-template-columns:246px minmax(0,1fr);gap:0;
    max-width:1400px;margin:0 auto;align-items:start}

  #navLateral{
    position:sticky;top:0;height:100vh;overflow-y:auto;
    border-right:1px solid var(--borde);padding:14px 12px 24px;
    display:flex;flex-direction:column;gap:14px;
    background:color-mix(in srgb,var(--hondo) 60%,transparent);
  }
  .nav-marca{display:flex;align-items:center;gap:9px;padding:6px 8px 12px;
    border-bottom:1px solid var(--borde)}
  .nav-marca h1{margin:0;font-size:var(--t-sub);letter-spacing:-.02em;font-weight:650}
  .nav-marca .pulso{width:26px;height:12px;flex:none;overflow:visible}
  .nav-marca .pulso path{fill:none;stroke:var(--aguja);stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}

  #navModulos{display:flex;flex-direction:column;gap:2px}
  .nav-item{
    display:block;width:100%;text-align:left;background:transparent;border:0;
    border-radius:var(--r-chico);padding:9px 11px;cursor:pointer;
    color:var(--suave);font-family:inherit;position:relative;
    transition:background var(--transicion),color var(--transicion);
  }
  .nav-item:hover{background:color-mix(in srgb,var(--texto) 5%,transparent);
    color:var(--texto);border-color:transparent}
  .nav-item.activo{background:color-mix(in srgb,var(--aguja) 13%,transparent);
    color:var(--texto)}
  /* La marca del módulo activo: una aguja en el margen, no un borde grueso. */
  .nav-item.activo::before{content:"";position:absolute;left:0;top:50%;
    transform:translateY(-50%);width:2px;height:18px;border-radius:2px;
    background:var(--aguja)}
  .nav-item .nav-nom{display:block;font-size:var(--t-pie);font-weight:600;
    line-height:1.35}
  .nav-item .nav-res{display:block;font-size:var(--t-micro);color:var(--tenue);
    line-height:1.35;margin-top:2px}
  .nav-item.activo .nav-res{color:var(--suave)}

  .nav-pie{margin-top:auto;padding-top:12px;border-top:1px solid var(--borde);
    display:flex;flex-direction:column;gap:7px}
  .nav-pie button{width:100%;text-align:left;font-size:var(--t-mini)}
  .nav-estado{display:flex;align-items:center;gap:7px;font-size:var(--t-mini);
    font-family:var(--mono);color:var(--suave);padding:6px 8px}
  .nav-estado .pip{width:7px;height:7px;border-radius:50%;background:var(--tenue);flex:none}
  .nav-estado.verde .pip{background:var(--tinta-bien)}
  .nav-estado.amarillo .pip{background:var(--tinta-ojo)}
  .nav-estado.rojo .pip{background:var(--tinta-mal)}

  #btnMenu{display:none}

  /* ------------------------------------------------------------ benchmark */

  .aviso-fuente{border:1px solid var(--borde);border-radius:var(--r);
    padding:13px 15px;font-size:var(--t-mini);color:var(--suave);
    margin-bottom:16px;max-width:78ch;line-height:1.6}
  .aviso-fuente b{color:var(--texto);font-weight:600}

  .bench-cabeza{display:flex;justify-content:space-between;align-items:center;
    gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .bench-marcador{display:flex;gap:9px;align-items:center;flex-wrap:wrap;
    font-size:var(--t-mini)}
  .pastilla{font-family:var(--mono);font-size:var(--t-mini);padding:3px 9px;
    border-radius:20px;border:1px solid var(--borde)}
  .pastilla.verde{color:var(--tinta-bien);
    border-color:color-mix(in srgb,var(--tinta-bien) 40%,transparent)}
  .pastilla.roja{color:var(--tinta-mal);
    border-color:color-mix(in srgb,var(--tinta-mal) 40%,transparent)}
  .pastilla.neutra{color:var(--tenue)}
  .bench-acciones{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .bench-acciones input{min-width:220px;font-size:var(--t-mini)}

  .cat-rot{font-size:var(--t-mini);color:var(--tenue);text-transform:uppercase;
    letter-spacing:.1em;margin:22px 0 9px;font-family:var(--mono);font-weight:600}
  table.tabla-bench td{vertical-align:top}
  table.tabla-bench .b-nom{color:var(--texto);font-size:var(--t-pie)}
  table.tabla-bench .b-dir{font-size:var(--t-micro);color:var(--tenue);
    font-family:var(--mono);margin-top:2px}
  table.tabla-bench input.ref{width:104px;text-align:right;font-family:var(--mono);
    font-size:var(--t-pie);padding:5px 9px}
  table.tabla-bench .b-brecha{font-family:var(--mono);white-space:nowrap}
  table.tabla-bench .b-lectura{color:var(--suave);font-size:var(--t-mini);
    text-align:left;max-width:34ch;line-height:1.5}

  /* -------------------------------------------------------- responsivo nav */

  @media (max-width:900px){
    .armazon{grid-template-columns:1fr}
    #navLateral{
      position:fixed;inset:0 auto 0 0;width:262px;z-index:60;height:100dvh;
      background:var(--fondo);transform:translateX(-100%);
      transition:transform var(--transicion);border-right:1px solid var(--borde);
    }
    #navLateral.abierto{transform:translateX(0);box-shadow:var(--sombra-alta)}
    #btnMenu{display:inline-flex;align-items:center;gap:7px}
  }

  /* ============================================================ IMPRESIÓN */

  @media print{
    /* El papel es blanco: se imprime en la calibración clara, sin importar
       cuál esté puesta en pantalla. */
    :root, html[data-cal="pantalla"], html[data-cal="proyector"]{
      --fondo:#fff; --panel:#fff; --hondo:#fff;
      --borde:#b9c2cf; --borde-vivo:#b9c2cf;
      --grid-fino:transparent; --grid-grueso:transparent;
      --texto:#000; --suave:#26313f; --tenue:#4a5666;
      --aguja:#8a4f04; --tinta-mal:#a01c14; --tinta-bien:#14573a;
      --tinta-ojo:#754c04; --tinta-dato:#153f6b;
      --sombra:none; --sombra-alta:none;
    }
    body{background:#fff!important}
    /* El ambar de papel es oscuro: el texto del boton primario tiene que
       invertirse o queda en 2,9:1. */
    button.primario, button.primario:hover:not(:disabled){color:#fff}

    /* Fuera todo lo que no es contenido. */
    #navLateral, .barra, #importador, #editor, .ayuda, .preguntas,
    #cajaPregunta, .imp-acciones, #btnMenu, .bench-acciones,
    .pro-flujos .cabeza button, .globo{display:none!important}

    .armazon{display:block;max-width:none}
    .envoltura{max-width:none;padding:0}
    .reticula::before{display:none}
    .tarjeta, .alerta, .ind, .pro-met, .esc, .quiebre{
      border:1px solid var(--borde);box-shadow:none;break-inside:avoid}
    section{break-inside:avoid-page;margin-bottom:18px}
    table{break-inside:auto}
    tr{break-inside:avoid}
    thead{display:table-header-group}
    h2, h3{break-after:avoid}

    /* En papel no hay hover ni tooltip: el modo docente se imprime siempre,
       porque es lo que permite auditar el informe fuera de la pantalla. */
    .docencia{display:block!important}

    /* Cada módulo empieza en su propia hoja. */
    .hoja{break-before:page}
    .hoja:first-child{break-before:auto}

    a[href]::after{content:""}
    .pie-impresion{display:block!important}
  }

  .pie-impresion{display:none;margin-top:28px;padding-top:14px;
    border-top:1px solid var(--borde);font-size:var(--t-mini);color:var(--tenue)}

</style>
</head>
<body>
<div class="armazon">

  <aside id="navLateral">
    <div class="nav-marca">
      <svg class="pulso" viewBox="0 0 26 12" aria-hidden="true">
        <path d="M0 6h6l2-4 3 8 2.5-5 2 2.5h10"/>
      </svg>
      <h1>Pálpito</h1>
    </div>
    <nav id="navModulos" aria-label="Módulos"></nav>
    <div class="nav-pie">
      <div class="nav-estado" id="cabEstado"><span class="pip"></span><span class="txt">—</span></div>
      <button id="btnCalibracion" title="Alterna el contraste para proyector o pantalla">Proyector</button>
      <button id="btnImprimir">Imprimir / PDF</button>
    </div>
  </aside>

  <div class="envoltura">
    <header class="principal">
      <button id="btnMenu" aria-label="Abrir módulos">Módulos</button>
      <div class="cab-empresa">
        <span class="nom" id="nombreEmpresa">cargando…</span>
        <span class="per" id="periodosCab"></span>
      </div>
    </header>

    <div class="barra">
      <select id="selectorCaso" aria-label="Caso a analizar"></select>
      <button id="btnImportar">Cargar archivo</button>
      <button id="btnEditor">Editar datos</button>
      <button id="btnGuardarCaso" style="display:none">Guardar este caso</button>
      <button id="btnBorrarCaso" style="display:none">Borrar</button>
      <button class="primario" id="btnRecalcular" style="display:none">Recalcular</button>
      <div class="derecha">
        <label class="interruptor">
          <input type="checkbox" id="chkDocente"> Modo docente
        </label>
      </div>
    </div>

    <div id="importador" class="tarjeta"></div>
    <div id="editor" class="tarjeta"></div>
    <div id="contenido"><div class="cargando">Cargando análisis…</div></div>

    <div class="pie-impresion" id="pieImpresion"></div>

    <footer>
      Los indicadores se calculan con fórmulas deterministas verificadas por
      pruebas automatizadas. Herramienta educativa: no constituye asesoría
      financiera.
    </footer>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let datosCaso = null;   // datos crudos editables
let analisis  = null;   // resultado del backend

/* Empresas que llegaron por archivo, no de la carpeta casos/.
   Viven mientras la pestaña esté abierta y NO se escriben en disco: cargar un
   PDF para probarlo no debe poder tocar los casos del repositorio, que son la
   evidencia de auditoría del proyecto. Se guardan aquí para poder ir y volver
   entre la empresa cargada y el caso del taller sin volver a subir el archivo,
   que es lo que se necesita en una exposición. Al recargar la página se
   pierden, y eso se avisa en pantalla. */
const casosCargados = new Map();
let casosServidor = [];
let nCargados = 0;

// ---------------------------------------------------------------- utilidades
const NOMBRES = {
  efectivo:"Efectivo", cuentas_por_cobrar:"Cuentas por cobrar", inventarios:"Inventarios",
  activo_corriente:"Activo corriente", propiedad_planta_equipo:"Propiedad, planta y equipo",
  activo_total:"Activo total", proveedores:"Proveedores", deuda_financiera_cp:"Deuda financiera CP",
  pasivo_corriente:"Pasivo corriente", deuda_financiera_lp:"Deuda financiera LP",
  patrimonio:"Patrimonio", ventas:"Ventas", costo_ventas:"Costo de ventas",
  utilidad_bruta:"Utilidad bruta", gastos_operacionales:"Gastos de administración y ventas",
  utilidad_operacional:"Utilidad operacional (EBIT)", gastos_financieros:"Gastos financieros",
  utilidad_antes_impuestos:"Utilidad antes de impuestos", impuestos:"Impuesto",
  utilidad_neta:"Utilidad neta", depreciacion:"Depreciación", compras:"Compras",
  ventas_credito:"Ventas a crédito"
};
const rotulo = k => NOMBRES[k] || k.replace(/_/g," ").replace(/^./,c=>c.toUpperCase());

function num(v, dec=2){
  if(v===null||v===undefined) return "n/d";
  return v.toLocaleString("es-CO",{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
function conUnidad(v, u){
  if(v===null||v===undefined) return "n/d";
  if(u==="%")     return num(v,2)+"%";
  if(u==="dias")  return num(v,1)+" días";
  if(u==="monto") return num(v,0);
  return num(v,2);
}
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ------------------------------------------------------------------- carga
async function cargarListaCasos(){
  casosServidor = await (await fetch("/api/casos")).json();
  pintarSelectorCasos();
  if(casosServidor.length) await cargarCaso(casosServidor[0].id);
}

/* Dibuja el desplegable con los casos del repositorio y, aparte, las empresas
   que se cargaron por archivo. Van en su propio grupo para que se vea de un
   vistazo cuáles son ejemplos del curso y cuál es la empresa que se acaba de
   subir. */
/* El botón de guardar solo aparece cuando hay algo que guardar: una empresa
   que llegó por archivo y todavía vive solo en esta pestaña. Para los casos del
   repositorio no tiene sentido, porque ya están en disco. */
/* Los tres casos del taller son la evidencia de auditoría del proyecto: la
   suite los verifica contra valores calculados a mano. El servidor los protege,
   y aquí ni siquiera se ofrece el botón. */
const CASOS_DEL_TALLER = ["comercial_andina", "andina_trienio", "andina_con_benchmark"];

function actualizarBotonGuardar(){
  const id = $("#selectorCaso").value;
  const enSesion = casosCargados.has(id);
  const b = $("#btnGuardarCaso");
  if(b) b.style.display = enSesion ? "" : "none";
  const d = $("#btnBorrarCaso");
  if(d) d.style.display = (enSesion || CASOS_DEL_TALLER.includes(id)) ? "none" : "";
}

async function borrarCasoActual(){
  const id = $("#selectorCaso").value;
  const nombre = $("#selectorCaso").selectedOptions[0]?.text || id;
  if(!confirm(`¿Borrar «${nombre}» del disco?\n\nEsto no se puede deshacer. ` +
              `El archivo del que salió no se toca.`)) return;
  try{
    const r = await fetch(`/api/casos/${encodeURIComponent(id)}`, {method:"DELETE"});
    if(!r.ok){
      const {detail} = await r.json().catch(() => ({detail:"Error del servidor"}));
      return alert("No se pudo borrar: " + detail);
    }
    await cargarListaCasos();
  }catch(e){
    alert("No se pudo borrar: " + e.message);
  }
}

async function guardarCasoActual(){
  const b = $("#btnGuardarCaso");
  const antes = b.textContent;
  b.disabled = true; b.textContent = "Guardando…";
  const pedir = async sobrescribir => fetch("/api/casos", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({estados: datosCaso, sobrescribir}),
  });
  try{
    let r = await pedir(false);
    if(r.status === 409){
      const {detail} = await r.json();
      /* Un 409 puede ser "ya existe" —que se puede confirmar— o "es un caso
         del taller" —que no—. Solo se ofrece reemplazar cuando de verdad se
         puede: los tres casos del taller son la evidencia de auditoría del
         proyecto y el servidor los protege pase lo que pase. */
      if(!detail.includes("caso del taller") && confirm(detail + "\n\n¿Reemplazarlo?")){
        r = await pedir(true);
      }else{
        alert(detail);
        return;
      }
    }
    if(!r.ok){
      const {detail} = await r.json().catch(() => ({detail:"Error del servidor"}));
      return alert("No se pudo guardar: " + detail);
    }
    const guardado = await r.json();
    /* Deja de ser "cargado en esta sesión" y pasa a ser un caso del disco. */
    casosCargados.delete($("#selectorCaso").value);
    await cargarListaCasos();
    await cargarCaso(guardado.id);
    alert(`Guardado como «${guardado.empresa}» con los periodos ` +
          `${(guardado.periodos || []).join(", ")}.\n\n` +
          `Ya no se pierde al cerrar el navegador.`);
  }catch(e){
    alert("No se pudo guardar: " + e.message);
  }finally{
    b.disabled = false; b.textContent = antes;
  }
}

function pintarSelectorCasos(){
  const opcion = c => `<option value="${esc(c.id)}">${esc(c.empresa)}</option>`;
  let html = casosServidor.map(opcion).join("");
  if(casosCargados.size){
    html += `<optgroup label="Cargados en esta sesión">` +
      [...casosCargados.values()].map(opcion).join("") + `</optgroup>`;
  }
  $("#selectorCaso").innerHTML = html;
}

async function cargarCaso(id){
  const cargado = casosCargados.get(id);
  datosCaso = cargado ? structuredClone(cargado.datos)
                      : await (await fetch(`/api/casos/${id}`)).json();
  $("#selectorCaso").value = id;
  actualizarBotonGuardar();
  await analizar();
  pintarEditor();
}

async function analizar(){
  $("#contenido").innerHTML = '<div class="cargando">Calculando…</div>';
  const r = await fetch("/api/analizar", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(datosCaso)
  });
  if(!r.ok){
    const e = await r.json().catch(()=>({detail:"Error desconocido"}));
    $("#contenido").innerHTML = `<div class="tarjeta semaforo rojo">
      <h3>No se pudo analizar</h3><div>${esc(e.detail)}</div></div>`;
    return;
  }
  analisis = await r.json();
  pintar();
}

// ------------------------------------------------------------------ pintado
function pintar(){
  const a = analisis;
  $("#nombreEmpresa").textContent = a.empresa;
  $("#periodosCab").textContent   = ` · ${a.periodos.join(" → ")} · ${a.moneda} (${a.unidad})`;
  pintarEstadoCabecera(a);
  pintarNavegacion();
  irA(moduloActivo, {recordar: false});
}

// ==========================================================================
// IMPRESIÓN
// En pantalla se ve un módulo a la vez; en papel tienen que ir todos, o el
// PDF que se entrega estaría incompleto. Se arma el documento completo, se
// imprime y se devuelve la pantalla al módulo en el que estaba.
// ==========================================================================

function imprimir(){
  const a = analisis;
  if(!a) return;
  const previo = $("#contenido").innerHTML;

  $("#contenido").innerHTML = MODULOS.map(m => `
    <div class="hoja">
      <div class="regla"><h2>${esc(m.nombre)}</h2></div>
      ${m.arma(a)}
    </div>`).join("");

  const hoy = new Date().toLocaleDateString("es-CO",
    {year:"numeric", month:"long", day:"numeric"});
  $("#pieImpresion").innerHTML =
    `Pálpito · ${esc(a.empresa)} · periodos ${esc(a.periodos.join(" a "))} · ` +
    `cifras en ${esc(a.moneda)} (${esc(a.unidad)}) · generado el ${hoy}. ` +
    `Los indicadores se calculan con fórmulas deterministas; cada uno viaja con ` +
    `su fórmula y su fuente. Herramienta educativa: no constituye asesoría financiera.`;

  const restaurar = () => {
    $("#contenido").innerHTML = previo;
    if(moduloActivo === "dictamen")  conectarIA();
    if(moduloActivo === "proyecto"){ conectarProyecto(); conectarMensual(); }
    if(moduloActivo === "benchmark") conectarBenchmark();
    window.removeEventListener("afterprint", restaurar);
  };
  window.addEventListener("afterprint", restaurar);

  // Un cuadro para que el navegador alcance a maquetar antes de abrir el diálogo.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    window.print();
    // Safari no siempre dispara afterprint: se restaura igual por si acaso.
    setTimeout(() => { if($("#secProyecto") === null && moduloActivo === "proyecto") restaurar(); }, 1200);
  }));
}

/* 1 — calidad de los datos */
function seccionCalidad(a){
  const v = a.validacion, r = v.resumen;
  const titulos = {
    rojo:"Los datos tienen inconsistencias que afectan el análisis",
    amarillo:"Los datos están incompletos",
    verde:"Los datos son consistentes"
  };
  const hall = v.hallazgos.map(h => `
    <div class="hallazgo">
      <span class="etiqueta ${h.severidad}">${h.severidad}</span>${esc(h.mensaje)}
      ${h.detalle ? `<div class="detalle">${esc(h.detalle)}</div>` : ""}
    </div>`).join("");
  /* Lo que el motor tuvo que cambiar para poder leer el archivo: voltear el
     signo de un costo que venía entre paréntesis, sumar los dos renglones en
     que un holding reparte su deuda financiera. El motor siempre lo anotó,
     pero nadie lo mostraba: quedaba escrito en los supuestos del JSON y ahí
     moría. Una cifra que no vino tal cual del PDF tiene que decir que no vino
     tal cual del PDF, o el "nunca en silencio" es solo una frase. */
  const ajustes = v.ajustes_importacion || [];
  const bloqueAjustes = !ajustes.length ? "" : `
    <div class="tarjeta" style="margin-top:16px">
      <h3>Lo que Pálpito ajustó al leer el archivo</h3>
      <p class="leyenda">Ninguna de estas cifras entró tal cual venía en el documento.
        El motor las transformó para poder calcular, y por eso lo dice.</p>
      ${ajustes.map(a => `
        <div class="hallazgo">
          <span class="etiqueta info">ajuste</span>${esc(a)}
        </div>`).join("")}
    </div>`;

  /* De dónde salieron las cifras, cuando vinieron del portal y no de un
     archivo. Una cifra que no se puede sustentar ante quien pregunte no sirve
     para analizar nada, así que se dice antes de mostrar el semáforo. */
  const proc = datosCaso?.procedencia;
  const bloqueProcedencia = !proc ? "" : `
    <div class="aviso-fuente" id="procedenciaEmpresa">
      <b>Fuente:</b> Superintendencia de Sociedades, vía datos.gov.co ·
      <b>NIT</b> ${esc(proc.nit)} · cortes <b>${(proc.cortes || []).map(esc).join(", ")}</b> ·
      descargado el ${esc(proc.descargado || "")}.<br>${esc(proc.nota || "")}
    </div>`;

  return `
  <section>
    <div class="regla"><h2>Calidad de los datos</h2></div>
    <p class="leyenda">Esto se verifica <em>antes</em> de calcular cualquier indicador.
      Un ratio sobre datos inconsistentes es un número bonito y falso.</p>
    ${bloqueProcedencia}
    <div class="tarjeta semaforo ${v.semaforo}">
      <h3>${titulos[v.semaforo]}</h3>
      <div class="conteos">
        <div><b style="color:var(--rojo)">${r.errores}</b>errores</div>
        <div><b style="color:var(--ambar)">${r.advertencias}</b>advertencias</div>
        <div><b style="color:var(--azul)">${r.informativos}</b>informativos</div>
      </div>
      ${hall || '<div class="hallazgo">Sin observaciones.</div>'}
    </div>
    ${bloqueAjustes}
  </section>`;
}


/* 1b — narrativa con IA */
let estadoIA = {disponible:false, motivo:"", modelo:null};

function seccionIA(){
  if(!estadoIA.disponible){
    return `
    <section>
      <div class="regla"><h2>Lectura del analista</h2></div>
      <div class="tarjeta">
        <div class="apagado">La redacción con inteligencia artificial está desactivada.
          ${esc(estadoIA.motivo)}<br><br>
          Todo lo demás de esta página —indicadores, alertas, puente de caja— se calcula
          sin IA y sigue siendo válido.</div>
      </div>
    </section>`;
  }
  return `
  <section>
    <div class="regla"><h2>Lectura del analista</h2></div>
    <p class="leyenda">La IA no calcula nada: recibe los números que el motor ya verificó
      y solo los traduce a lenguaje corriente.</p>
    <div class="tarjeta ia">
      <div id="salidaIA" class="prosa apagado">
        Presiona el botón para que el modelo redacte el diagnóstico.
      </div>
      <div style="margin-top:14px">
        <button class="primario" id="btnNarrar">Redactar diagnóstico</button>
      </div>
    </div>

    <div class="regla" style="margin-top:30px"><h2>Pregúntale a tus datos</h2></div>
    <p class="leyenda">Responde solo con las cifras de esta empresa y cita sus fuentes.</p>
    <div class="tarjeta ia">
      <div class="preguntas">
        <button class="sugerencia">¿Por qué tengo menos plata si vendí más?</button>
        <button class="sugerencia">¿Cuál es mi problema más grave?</button>
        <button class="sugerencia">¿Puedo endeudarme más?</button>
        <button class="sugerencia">¿Qué pasa si cobro 10 días más rápido?</button>
      </div>
      <div id="cajaPregunta">
        <input id="inpPregunta" placeholder="Escribe tu pregunta…" maxlength="500">
        <button class="primario" id="btnPreguntar">Preguntar</button>
      </div>
      <div id="salidaPregunta" class="prosa" style="margin-top:14px"></div>
    </div>
  </section>`;
}

/* markdown mínimo: negritas y párrafos */
function md(t){
  return esc(t)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .split(/\n\s*\n/).map(p => `<p>${p.replace(/\n/g,"<br>")}</p>`).join("");
}

function sello(modelo){
  return `<div class="sello"><span class="punto"></span>Redactado por ${esc(modelo)}
    · sobre cifras verificadas por el motor</div>`;
}

async function pedirIA(ruta, cuerpo, destino, textoCargando){
  const salida = $(destino);
  salida.className = "prosa apagado";
  salida.textContent = textoCargando;
  try{
    const r = await fetch(ruta, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(cuerpo)
    });
    /* Un error del servidor no siempre viene en JSON. Cuando algo revienta
       fuera de un HTTPException, FastAPI responde "Internal Server Error" en
       texto plano, y r.json() fallaba con "Unexpected token 'I'" — un error
       sobre el error, que tapaba el de verdad. */
    const crudo = await r.text();
    let d = null;
    try{ d = JSON.parse(crudo); }catch(_){ /* no era JSON */ }
    if(!r.ok){
      throw new Error((d && d.detail) || crudo.slice(0, 300) ||
                      `El servidor respondió ${r.status}.`);
    }
    if(d === null) throw new Error("El servidor respondió algo que no es JSON.");
    if(!d.disponible){ salida.textContent = d.motivo; return; }
    salida.className = "prosa";
    salida.innerHTML = md(d.texto) + sello(d.modelo);
  }catch(e){
    salida.className = "prosa";
    salida.innerHTML = `<span style="color:var(--rojo)">No se pudo obtener la respuesta: ${esc(e.message)}</span>`;
  }
}

function conectarIA(){
  const btnN = $("#btnNarrar");
  if(btnN) btnN.addEventListener("click", () =>
    pedirIA("/api/narrar", {estados: datosCaso}, "#salidaIA", "Redactando…"));

  const btnP = $("#btnPreguntar");
  if(btnP){
    const lanzar = () => {
      const q = $("#inpPregunta").value.trim();
      if(!q) return;
      pedirIA("/api/preguntar", {estados: datosCaso, pregunta: q},
              "#salidaPregunta", "Consultando…");
    };
    btnP.addEventListener("click", lanzar);
    $("#inpPregunta").addEventListener("keydown", e => { if(e.key==="Enter") lanzar(); });
    document.querySelectorAll(".sugerencia").forEach(b =>
      b.addEventListener("click", () => { $("#inpPregunta").value = b.textContent.trim(); lanzar(); }));
  }
}

/* 3 — diagnóstico */
function seccionDiagnostico(a){
  const alertas = a.alertas.map(al => `
    <div class="alerta ${al.prioridad<=3?"top":""}">
      <div class="rank">${al.prioridad}</div>
      <div style="flex:1">
        <h4>${esc(al.titulo)}</h4>
        <p>${esc(al.explicacion)}</p>
        <div class="fuentes">
          <div class="rotulo">Evidencia</div>
          ${al.evidencia.map(e=>`<div>${esc(e)}</div>`).join("")}
        </div>
      </div>
    </div>`).join("");
  const recs = a.recomendaciones.map(r=>`<li>${esc(r)}</li>`).join("");
  return `
  <section>
    <div class="regla"><h2>Diagnóstico</h2></div>
    <p class="leyenda">Alertas ordenadas por prioridad. Generadas por reglas explícitas,
      no por inteligencia artificial: cada una cita la evidencia numérica que la disparó.</p>
    ${alertas || '<div class="tarjeta">Sin alertas.</div>'}
    ${recs ? `<div class="regla" style="margin-top:30px"><h2>Recomendaciones</h2></div>
      <div class="tarjeta"><ol class="recomendaciones">${recs}</ol></div>` : ""}
  </section>`;
}

/* 3 — puente de caja */
/* Un renglón del puente de caja. La palabra la decide el signo del número, no
   el sitio donde va: si el capital de trabajo baja, o si la depreciación supera
   a la inversión del año, la partida LIBERA caja en vez de consumirla. Con un
   "−" fijo delante, Éxito 2025 mostraba "− Consumido por inversión en activos
   fijos  −−103.328": dos signos y una etiqueta que decía lo contrario de lo que
   pasó. Misma regla que diagnostico.renglon_de_caja en el motor. */
function renglonDeCaja(que, v){
  if(v === null || v === undefined)
    return `<div class="fila"><span>${que}</span><span class="apagado">n/d</span></div>`;
  const libera = v < 0;
  return `<div class="fila">
    <span>${libera ? "+ Liberado por" : "− Consumido por"} ${que}</span>
    <span style="color:var(--${libera ? "verde" : "rojo"})">${libera ? "+" : "−"}${num(Math.abs(v),0)}</span>
  </div>`;
}

function seccionPuente(a){
  const p = a.puente_caja;
  if(!p.disponible) return "";
  const signo = v => v===null ? "n/d" : (v<0?"−":"") + num(Math.abs(v),0);
  const fcl = p.flujo_caja_libre_aprox;
  const color = fcl===null ? "var(--tenue)" : (fcl<0 ? "var(--rojo)" : "var(--verde)");
  return `
  <section>
    <div class="regla"><h2>Puente de caja</h2></div>
    <p class="leyenda">Por qué la empresa puede vender más, reportar utilidades y aun así
      tener menos plata. Marco de Oscar León García.</p>
    <div class="tarjeta puente">
      <div class="fila"><span>UODI generada por la operación</span>
        <span>${signo(p.uodi)}</span></div>
      ${renglonDeCaja("el aumento del capital de trabajo (KTNO)", p.aumento_ktno)}
      ${renglonDeCaja("inversión en activos fijos", p.aumento_activos_fijos_neto)}
      <div class="fila total"><span>Flujo de caja libre aproximado</span>
        <span style="color:${color}">${signo(fcl)}</span></div>
      <div style="margin-top:16px">
        <div class="fila eco"><span>Se cubrió con más deuda financiera</span>
          <span>${signo(p.variacion_deuda_financiera)}</span></div>
        <div class="fila eco"><span>Y con el efectivo que había en caja</span>
          <span>${signo(p.variacion_efectivo)}</span></div>
      </div>
      ${p.es_aproximacion ? `<div class="aviso">${esc(p.advertencia)}</div>` : ""}
    </div>
  </section>`;
}

/* 4 — DuPont */
function seccionDupont(a){
  const d = a.dupont, f = d.factores, per = a.periodos;
  if(!f.roe_reconstruido.some(v=>v!==null)) return "";
  const fila = (nom, clave, dec) => `
    <tr><td>${nom}</td>${f[clave].map(v=>`<td class="num">${num(v,dec)}</td>`).join("")}
      <td class="num ${varClase(d.variacion_por_factor_pct?.[clave])}">
        ${d.variacion_por_factor_pct?.[clave]!=null ? num(d.variacion_por_factor_pct[clave],2)+"%" : "—"}</td></tr>`;
  return `
  <section>
    <div class="regla"><h2>Descomposición DuPont</h2></div>
    <p class="leyenda">Separa la rentabilidad del socio en tres palancas. Saber cuál se movió
      dice dónde hay que actuar.</p>
    <div class="tarjeta">
      <div style="font-family:var(--mono);font-size:12.5px;color:var(--oro);margin-bottom:14px">
        ${esc(d.formula)}</div>
      <div class="desplazable"><table>
        <thead><tr><th>Factor</th>${per.map(p=>`<th>${p}</th>`).join("")}<th>Variación</th></tr></thead>
        <tbody>
          ${fila("Margen neto (rentabilidad por peso vendido)","margen_neto",4)}
          ${fila("Rotación de activos (eficiencia)","rotacion_activos",4)}
          ${fila("Multiplicador del patrimonio (deuda)","multiplicador_patrimonio",4)}
          <tr style="font-weight:700;border-top:2px solid var(--oro)">
            <td>ROE reconstruido</td>
            ${f.roe_reconstruido.map(v=>`<td class="num">${num(v,2)}%</td>`).join("")}<td></td></tr>
        </tbody>
      </table></div>
    </div>
  </section>`;
}
const varClase = v => v==null ? "neutro" : (v>0.5 ? "sube" : v<-0.5 ? "baja" : "neutro");

/* ------------------------------------------------------------ importador
   Cargar un archivo NO analiza nada por su cuenta. Lee, propone un mapeo y se
   detiene a que el usuario lo revise fila por fila. Solo cuando él confirma se
   arman los estados financieros y se calcula. La propuesta del modelo, cuando
   se pide, llega marcada como propuesta y se puede corregir en el mismo sitio. */

let tablaImportada = null;   // lo leído del archivo, con el mapeo en curso
let catalogoCuentas = null;  // cuentas que entiende el motor

async function cuentas(){
  if(!catalogoCuentas) catalogoCuentas = await (await fetch("/api/cuentas")).json();
  return catalogoCuentas;
}
