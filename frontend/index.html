/* ------------------------------------------------ cargar por nombre / NIT
   Aquí NO hay inteligencia artificial, y es mejor que no la haya: se escribe
   el nombre, se escoge el NIT y se pide la cifra exacta al portal de datos
   abiertos. Siempre la misma, auditable. Es la única parte de la aplicación
   que toca internet, y solo cuando se pulsa Buscar: si no hay red, avisa y
   todo lo demás sigue funcionando. */

function conectarBusqueda(){
  const form = $("#formNombre");
  if(!form) return;
  form.addEventListener("submit", e => { e.preventDefault(); buscarPorNombre(); });
}

async function buscarPorNombre(){
  const q = ($("#textoNombre")?.value || "").trim();
  const caja = $("#resultadosNombre");
  if(q.length < 2){ caja.innerHTML = `<div class="vacio">Escriba al menos dos letras.</div>`; return; }
  caja.innerHTML = `<div class="vacio">Buscando en el directorio de Supersociedades…</div>`;
  let r;
  try{
    r = await fetch(`/api/supersociedades/buscar?q=${encodeURIComponent(q)}`);
  }catch(e){
    return caja.innerHTML = `<div class="aviso">No se pudo consultar el portal. ${esc(e.message)}</div>`;
  }
  if(!r.ok){
    const err = await r.json().catch(() => ({detail:"Error desconocido"}));
    return caja.innerHTML = `<div class="aviso">${esc(err.detail)}</div>`;
  }
  const lista = await r.json();
  if(!lista.length){
    return caja.innerHTML = `<div class="vacio">Ninguna sociedad con ese nombre le reporta a
      Supersociedades. Si cotiza en bolsa, le reporta a la Superfinanciera: cargue el PDF.
      Si es una pyme que no está obligada a reportar, cargue el Excel o digite los datos.</div>`;
  }
  caja.innerHTML = lista.map(e => `
    <button type="button" data-nit="${esc(e.nit)}" data-razon="${esc(e.razon_social)}">
      <span>${esc(e.razon_social)}</span><span class="nit">NIT ${esc(e.nit)}</span>
    </button>`).join("");
  caja.querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => cargarPorNit(b.dataset.nit, b.dataset.razon)));
}

async function cargarPorNit(nit, razon){
  $("#importador").innerHTML = `<div class="cargando">Trayendo los estados de ${esc(razon)} desde Supersociedades…</div>`;
  let r;
  try{
    r = await fetch("/api/supersociedades/cargar", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({nit, razon_social: razon}),
    });
  }catch(e){
    return pintarSoltar(`<div class="tarjeta semaforo rojo" style="margin-top:14px">
      <h3>No se pudo consultar el portal</h3><div>${esc(e.message)}</div></div>`);
  }
  if(!r.ok){
    const err = await r.json().catch(() => ({detail:"Error desconocido"}));
    return pintarSoltar(`<div class="tarjeta semaforo rojo" style="margin-top:14px">
      <h3>No se pudieron traer los estados</h3><div>${esc(err.detail)}</div></div>`);
  }
  const recien = await r.json();
  /* Un nombre propio en vez de la razón social en mayúsculas del registro. */
  recien.empresa = recien.empresa || razon;
  await adoptarEstados(recien);
}

/* Lo que pasa cuando unos estados nuevos —de un archivo o del portal— quedan
   listos: entran al desplegable con su nombre, se analizan y se abre el editor. */
async function adoptarEstados(recien){
  datosCaso = recien;
  $("#importador").classList.remove("abierto");
  $("#btnImportar").textContent = "Cargar archivo";
  tablaImportada = null;

  const id = `cargado-${++nCargados}`;
  casosCargados.set(id, {
    id,
    empresa: datosCaso.empresa || "Empresa importada",
    datos: structuredClone(datosCaso),
  });
  pintarSelectorCasos();
  $("#selectorCaso").value = id;
  actualizarBotonGuardar();

  await analizar();
  pintarEditor();
}

function conectarSoltar(){
  const zona = $("#zonaSoltar"), input = $("#archivoOculto");
  if(!zona) return;
  $("#btnElegir").addEventListener("click", () => input.click());
  input.addEventListener("change", () => { if(input.files.length) encolar([...input.files]); });
  ["dragenter","dragover"].forEach(ev => zona.addEventListener(ev, e => {
    e.preventDefault(); zona.classList.add("encima");
  }));
  ["dragleave","drop"].forEach(ev => zona.addEventListener(ev, e => {
    e.preventDefault(); zona.classList.remove("encima");
  }));
  zona.addEventListener("drop", e => {
    const f = [...e.dataTransfer.files];
    if(f.length) encolar(f);
  });
}

/* Cola de archivos pendientes. Se pueden escoger varios de una vez —el informe
   de 2024 y el de 2025 de la misma empresa— y Pálpito los va pasando uno por
   uno por la pantalla de revisión, que NO se salta: cada archivo se mira antes
   de entrar. A partir del segundo, la casilla "Añadir estos años" viene marcada
   sola, porque es lo que se pidió al escogerlos juntos. */
let colaArchivos = [];
let enTanda = false;   // se escogieron varios archivos de una vez
/* Cuántos de la tanda ya pasaron por la revisión. Importa porque el PRIMERO no
   se une a nada: se une lo que viene DESPUÉS de él. Marcar la casilla también
   en el primero funde el archivo nuevo con el caso que estuviera en pantalla
   —al abrir la app, el del taller—, y eso produce un caso con el nombre de una
   empresa y las cifras de otra. Ya pasó una vez. */
let posicionEnTanda = 0;

function encolar(archivos){
  colaArchivos = archivos.slice(1);
  enTanda = archivos.length > 1;
  posicionEnTanda = 0;
  subir(archivos[0]);
}

function siguienteEnCola(){
  if(!colaArchivos.length) return false;
  const f = colaArchivos.shift();
  posicionEnTanda++;
  $("#importador").classList.add("abierto");
  $("#btnImportar").textContent = "Ocultar carga";
  subir(f);
  return true;
}

async function subir(archivo){
  $("#importador").innerHTML = `<div class="cargando">Leyendo ${esc(archivo.name)}…</div>`;
  const cuerpo = new FormData();
  cuerpo.append("archivo", archivo);
  const paginas = ($("#paginasPdf")?.value || "").trim();
  if(paginas) cuerpo.append("paginas", paginas);
  let r;
  try{
    r = await fetch("/api/importar", {method:"POST", body: cuerpo});
  }catch(e){
    return pintarSoltar(`<div class="tarjeta semaforo rojo" style="margin-top:14px">
      <h3>No se pudo enviar el archivo</h3><div>${esc(e.message)}</div></div>`);
  }
  if(!r.ok){
    const err = await r.json().catch(() => ({detail:"Error desconocido"}));
    return pintarSoltar(`<div class="tarjeta semaforo rojo" style="margin-top:14px">
      <h3>No se pudo leer el archivo</h3><div>${esc(err.detail)}</div></div>`);
  }
  tablaImportada = await r.json();
  tablaImportada.empresa = archivo.name.replace(/\.[^.]+$/, "");
  await pintarMapeo();
}

function selectorCuenta(fila, indice, catalogo){
  const opcion = c => `<option value="${c.codigo}"${c.codigo === fila.cuenta ? " selected" : ""}>${esc(rotulo(c.codigo))}</option>`;
  const balance = catalogo.filter(c => c.grupo === "balance").map(opcion).join("");
  const resultados = catalogo.filter(c => c.grupo === "resultados").map(opcion).join("");
  return `<select data-fila="${indice}">
    <option value=""${fila.cuenta ? "" : " selected"}>— no usar esta fila —</option>
    <optgroup label="Balance general">${balance}</optgroup>
    <optgroup label="Estado de resultados">${resultados}</optgroup>
  </select>`;
}

function selloDe(fila){
  if(!fila.cuenta) return "";
  const quien = fila.asignado_por || "usuario";
  const clase = fila.confianza === "baja" ? "baja" : quien;
  const texto = {diccionario:"diccionario", modelo:"propuesta del modelo", usuario:"usted"}[quien] || quien;
  const conf = fila.confianza && quien !== "usuario" ? ` · ${fila.confianza}` : "";
  return `<span class="sello-origen ${clase}">${esc(texto)}${esc(conf)}</span>`;
}

/* Alinea los valores de una fila con los periodos declarados, EXACTAMENTE como
   lo hace el motor al armar los estados: cuando sobran números se conservan los
   últimos, no los primeros, porque la columna de la izquierda de un estado
   publicado suele ser el número de nota.

   Esta pantalla mostraba los primeros, así que en el informe de Grupo Bolívar
   —"Efectivo y equivalentes de efectivo 13 $ 23.619.550 16.688.209"— enseñaba
   el 13 de la nota como si fuera el saldo de 2025. El motor calculaba bien; la
   pantalla que existe para revisarlo era la que mentía. */
function alinearConPeriodos(valores, n){
  const v = valores || [];
  if(v.length > n) return {usados: v.slice(v.length - n), descartados: v.slice(0, v.length - n)};
  return {usados: v.concat(Array(n - v.length).fill(null)), descartados: []};
}

/* Un informe anual trae dos años. Con dos informes se ven tres, que es lo que
   hace falta para leer una tendencia: con dos años solo se ve un salto. El
   motor siempre supo trabajar con hasta seis periodos —el caso del trienio
   corre con tres—, pero el cargador solo aceptaba un archivo. Esta opción es
   la escalera que faltaba. */
function bloqueAniadir(){
  if(!datosCaso || !(datosCaso.periodos || []).length) return "";
  /* Si el usuario escogió varios archivos de una, viene marcada DEL SEGUNDO EN
     ADELANTE: escogerlos juntos ES pedir que se unan entre ellos, no pedir que
     el primero se pegue a lo que hubiera antes en pantalla. Igual se puede
     marcar a mano si eso es justo lo que se quiere. */
  const marcada = (enTanda && posicionEnTanda > 0) ? " checked" : "";
  const n = colaArchivos.length;
  const pendientes = n
    ? `<div class="leyenda" style="margin:8px 0 0"><b>Qued${n > 1 ? "an" : "a"} ${n}
       archivo${n > 1 ? "s" : ""} por revisar</b> después de este.</div>`
    : "";
  return `
    <div class="tarjeta" style="margin-top:14px">
      <label style="display:flex;gap:9px;align-items:flex-start;cursor:pointer">
        <input type="checkbox" id="impAniadir"${marcada} style="margin-top:3px">
        <span>
          <b>Añadir estos años a «${esc(datosCaso.empresa)}»</b>
          <div class="leyenda" style="margin:4px 0 0">
            Ahora tiene ${esc((datosCaso.periodos || []).join(", "))}.
            Sin marcar, este archivo <b>reemplaza</b> lo cargado.
            Marcado, se unen los años. Un año que venga en los dos archivos se
            le preguntará cuál conservar.
          </div>
        </span>
      </label>
      ${pendientes}
    </div>`;
}

async function pintarMapeo(){
  const t = tablaImportada, catalogo = await cuentas();
  const asignadas = t.filas.filter(f => f.cuenta).length;
  const libres = t.filas.length - asignadas;

  const filas = t.filas.map((f, i) => {
    const {usados, descartados} = alinearConPeriodos(f.valores, t.periodos.length);
    /* Lo descartado se muestra, no se esconde: si el motor va a ignorar un
       número, quien revisa tiene derecho a ver cuál y decidir si se equivocó. */
    const aviso = descartados.length
      ? `<div class="detalle">No se usará ${descartados.map(x => num(x, 0)).join(", ")}
           —la columna de la izquierda de un estado publicado suele ser el número de nota—.</div>`
      : "";
    return `
    <tr class="${f.cuenta ? "" : "libre"}">
      <td class="etiqueta">${esc(f.etiqueta)}
        ${f.origen ? `<div class="orig">${esc(f.origen)}</div>` : ""}
        ${f.nota ? `<div class="detalle">${esc(f.nota)}</div>` : ""}
        ${aviso}</td>
      ${usados.map(v => `<td class="cifra">${v === undefined || v === null ? "—" : num(v, 0)}</td>`).join("")}
      <td>${selectorCuenta(f, i, catalogo)}</td>
      <td>${selloDe(f)}</td>
    </tr>`;
  }).join("");

  $("#importador").innerHTML = `
    <div class="imp-cabeza">
      <div>
        <h3>Revise antes de calcular</h3>
        <div class="archivo">${esc(t.origen)}</div>
      </div>
      <div class="conteo-mapeo"><b>${asignadas}</b> de <b>${t.filas.length}</b> filas
        asignadas${libres ? ` · ${libres} sin usar` : ""}</div>
    </div>

    ${(t.avisos || []).map(a => `<div class="aviso">${esc(a)}</div>`).join("")}

    <div class="imp-meta">
      <label>Empresa<input id="impEmpresa" value="${esc(t.empresa || "")}"></label>
      <label>Unidad<input id="impUnidad" value="${esc(t.unidad || "millones")}"></label>
      <label>Moneda<input id="impMoneda" value="${esc(t.moneda || "COP")}"></label>
      ${t.periodos.map((p, i) => `<label>Periodo ${i + 1}
        <input class="periodo" data-periodo="${i}" value="${esc(p)}"></label>`).join("")}
    </div>

    ${bloqueAniadir()}

    <div class="desplazable"><table class="mapeo">
      <thead><tr><th>Fila del archivo</th>
        ${t.periodos.map(p => `<th>${esc(p)}</th>`).join("")}
        <th>Se usará como</th><th>Lo asignó</th></tr></thead>
      <tbody>${filas}</tbody>
    </table></div>

    <div class="imp-acciones">
      <button class="primario" id="btnUsar">Usar estos datos</button>
      ${libres && estadoIA.disponible
        ? `<button id="btnProponer">Proponerme las ${libres} que faltan</button>` : ""}
      <button id="btnOtroArchivo">Cargar otro archivo</button>
      <span class="apagado">Nada se calcula hasta que presione <b>Usar estos datos</b>.</span>
    </div>`;

  conectarMapeo();
}

function conectarMapeo(){
  $("#importador").querySelectorAll("select[data-fila]").forEach(sel => {
    sel.addEventListener("change", () => {
      const i = +sel.dataset.fila, valor = sel.value || null;
      // Una cuenta no puede quedar en dos filas: si la toma otra, se libera.
      if(valor) tablaImportada.filas.forEach((f, j) => {
        if(j !== i && f.cuenta === valor){
          f.cuenta = null; f.asignado_por = ""; f.confianza = "";
          f.nota = "Quedó libre: esa cuenta se la asignó a otra fila.";
        }
      });
      const fila = tablaImportada.filas[i];
      fila.cuenta = valor;
      fila.asignado_por = valor ? "usuario" : "";
      fila.confianza = "";
      fila.nota = "";
      pintarMapeo();
    });
  });

  $("#importador").querySelectorAll("input[data-periodo]").forEach(inp => {
    inp.addEventListener("change", () => {
      tablaImportada.periodos[+inp.dataset.periodo] = inp.value.trim() || inp.dataset.periodo;
    });
  });

  const btnProponer = $("#btnProponer");
  if(btnProponer) btnProponer.addEventListener("click", proponerConModelo);
  $("#btnOtroArchivo").addEventListener("click", () => pintarSoltar(""));
  $("#btnUsar").addEventListener("click", usarImportado);
}

async function proponerConModelo(){
  const btn = $("#btnProponer");
  btn.disabled = true;
  btn.textContent = "Preguntándole al modelo…";
  const pendientes = tablaImportada.filas.filter(f => !f.cuenta).map(f => f.etiqueta);
  try{
    const r = await fetch("/api/importar/proponer", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({etiquetas: pendientes}),
    });
    const datos = await r.json();
    const tomadas = new Set(tablaImportada.filas.filter(f => f.cuenta).map(f => f.cuenta));
    let puestas = 0;
    (datos.asignaciones || []).forEach(a => {
      if(tomadas.has(a.cuenta)) return;
      const fila = tablaImportada.filas.find(f => !f.cuenta && f.etiqueta === a.etiqueta);
      if(!fila) return;
      fila.cuenta = a.cuenta;
      fila.asignado_por = "modelo";
      fila.confianza = a.confianza;
      fila.nota = "Propuesta del modelo, sin confirmar. Revísela.";
      tomadas.add(a.cuenta);
      puestas++;
    });
    await pintarMapeo();
    if(!puestas) $("#importador").insertAdjacentHTML("afterbegin",
      `<div class="aviso">El modelo no encontró correspondencia clara para
       ninguna de las filas que faltaban. Asígnelas a mano o déjelas sin usar.</div>`);
  }catch(e){
    btn.disabled = false;
    btn.textContent = "Reintentar la propuesta";
  }
}

async function usarImportado(){
  const t = tablaImportada;
  t.empresa = $("#impEmpresa").value.trim() || "Empresa importada";
  t.unidad  = $("#impUnidad").value.trim()  || "millones";
  t.moneda  = $("#impMoneda").value.trim()  || "COP";

  const r = await fetch("/api/importar/armar", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(t),
  });
  if(!r.ok){
    const err = await r.json().catch(() => ({detail:"Error desconocido"}));
    return $("#importador").insertAdjacentHTML("afterbegin",
      `<div class="aviso">${esc(err.detail)}</div>`);
  }

  let recien = await r.json();

  /* Unir los años de dos archivos. La decisión sobre un año repetido NO se
     toma sola: las empresas reexpresan cifras de un informe al siguiente, así
     que las dos versiones pueden diferir de verdad y elegir en silencio sería
     inventar. Promediarlas, peor. */
  if($("#impAniadir")?.checked && datosCaso && (datosCaso.periodos || []).length){
    const repetidos = (recien.periodos || []).filter(p => datosCaso.periodos.includes(p));
    let conservar = "nuevo";
    if(repetidos.length){
      conservar = confirm(
        `El periodo ${repetidos.join(", ")} viene en los dos archivos.\n\n` +
        `Aceptar = conservar las cifras del archivo que ACABA de cargar.\n` +
        `Cancelar = conservar las que ya estaban.\n\n` +
        `Las empresas reexpresan cifras de un informe al siguiente, así que ` +
        `las dos versiones pueden ser distintas y las dos correctas.`
      ) ? "nuevo" : "base";
    }
    const rf = await fetch("/api/importar/fundir", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({base: datosCaso, nuevo: recien, conservar}),
    });
    if(!rf.ok){
      const err = await rf.json().catch(() => ({detail:"Error desconocido"}));
      return $("#importador").insertAdjacentHTML("afterbegin",
        `<div class="aviso">No se pudieron unir los años: ${esc(err.detail)}</div>`);
    }
    recien = await rf.json();
  }

  /* Se suelta la tabla del archivo que se acaba de usar (adoptarEstados lo
     hace). Sin esto, volver a pulsar "Cargar archivo" mostraba la revisión del
     archivo ANTERIOR en vez de dejar escoger uno nuevo, y parecía que la
     aplicación no aceptara más de un archivo.

     La empresa cargada entra al desplegable con su nombre. Antes aquí se
     dejaba el selector en blanco, así que la empresa quedaba analizada pero
     sin figurar en ninguna parte, y devolverse al caso del taller obligaba a
     volver a subir el archivo. */
  await adoptarEstados(recien);

  // Si venían varios archivos, el siguiente entra solo por la misma revisión.
  if(!siguienteEnCola()){ enTanda = false; posicionEnTanda = 0; }
}

/* 2 — puntaje de salud financiera
   El puntaje, las notas y las ponderaciones vienen calculados del motor. Lo
   único que ocurre aquí es dibujo: el arco, las barras y la curva de fondo de
   cada escala, que no es más que la propia escala que envió el backend puesta
   en coordenadas. El número que se lee es el que calculó Python. */

// Color según puntaje: rojo en 0, ámbar en 50, verde en 100.
function colorNota(p){
  if(p === null || p === undefined) return "#6b83a3";
  const mezclar = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const rojo = [248, 113, 113], ambar = [251, 191, 36], verde = [74, 222, 128];
  const c = p < 50 ? mezclar(rojo, ambar, p / 50) : mezclar(ambar, verde, (p - 50) / 50);
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

// Evalúa la escala que mandó el backend, solo para dibujar su curva de fondo.
function evaluarEscala(valor, escala){
  if(valor <= escala[0][0]) return escala[0][1];
  if(valor >= escala[escala.length - 1][0]) return escala[escala.length - 1][1];
  for(let i = 0; i < escala.length - 1; i++){
    const [x0, y0] = escala[i], [x1, y1] = escala[i + 1];
    if(valor >= x0 && valor <= x1)
      return x1 === x0 ? y0 : y0 + (y1 - y0) * (valor - x0) / (x1 - x0);
  }
  return escala[escala.length - 1][1];
}

/* La escala del criterio, dibujada: dónde premia, dónde castiga y en qué
   punto exacto cayó esta empresa. Es lo que hace auditable la nota. */
function dibujarEscala(c){
  const esc = c.escala;
  const min = esc[0][0], max = esc[esc.length - 1][0];
  const W = 300, H = 46, izq = 4, der = 4, arriba = 6, altoBanda = 15;
  const ancho = W - izq - der;
  const px = v => izq + (v - min) / ((max - min) || 1) * ancho;

  let franjas = "";
  const pasos = 60;
  for(let i = 0; i < pasos; i++){
    const v0 = min + (max - min) * i / pasos;
    const v1 = min + (max - min) * (i + 1) / pasos;
    const medio = (v0 + v1) / 2;
    franjas += `<rect x="${px(v0).toFixed(2)}" y="${arriba}" width="${(px(v1) - px(v0) + 0.6).toFixed(2)}"
      height="${altoBanda}" fill="${colorNota(evaluarEscala(medio, esc))}"/>`;
  }

  let marcas = "";
  [esc[0], esc[esc.length - 1]].forEach((p, i) => {
    marcas += `<text x="${px(p[0]).toFixed(1)}" y="${arriba + altoBanda + 12}"
      text-anchor="${i === 0 ? "start" : "end"}">${num(p[0], 0)}</text>`;
  });

  let aguja = "";
  if(hay(c.valor)){
    const x = Math.max(izq, Math.min(izq + ancho, px(c.valor)));
    aguja = `<polygon points="${(x - 5).toFixed(1)},${arriba - 5} ${(x + 5).toFixed(1)},${arriba - 5} ${x.toFixed(1)},${arriba + 1}"
        fill="var(--texto)"/>`
      + `<line x1="${x.toFixed(1)}" y1="${arriba}" x2="${x.toFixed(1)}" y2="${arriba + altoBanda}"
          stroke="#0b1523" stroke-width="2"/>`
      + `<text x="${x.toFixed(1)}" y="${H - 2}" text-anchor="middle" fill="var(--texto)">${conUnidad(c.valor, c.unidad)}</text>`;
  }

  return `<svg class="escala-svg" viewBox="0 0 ${W} ${H}">${franjas}${marcas}${aguja}</svg>`;
}

function fichaCriterio(c){
  if(!c.evaluable){
    return `<details class="excluido">
      <summary><span class="izq">${esc(c.nombre)}</span>
        <span class="cifras">no evaluado</span></summary>
      <div class="cuerpo">${esc(c.motivo)} Su peso se repartió entre los demás
        indicadores de la dimensión, en vez de contar como cero.
        <div class="cita">${esc(c.fuente)}</div></div></details>`;
  }
  const desglose = hay(c.tendencia)
    ? `nota = 70% × ${num(c.nivel, 1)} (nivel) + 30% × ${num(c.tendencia, 1)} (tendencia) = ${num(c.nota, 1)}`
    : `nota = nivel = ${num(c.nivel, 1)}`;
  return `<details>
    <summary>
      <span class="izq">${esc(c.nombre)}
        <span class="peso" style="color:var(--tenue);font-size:11px"> · pesa ${num(c.peso_efectivo, 0)}% aquí</span></span>
      <span class="cifras">${conUnidad(c.valor, c.unidad)} →
        <b style="color:${colorNota(c.nota)}">${num(c.nota, 0)}</b>/100</span>
    </summary>
    <div class="cuerpo">
      ${esc(c.justificacion)}
      ${c.derivado ? `<div class="desglose">se calcula como: ${esc(c.derivado)}</div>` : ""}
      ${dibujarEscala(c)}
      <div class="desglose">${esc(desglose)}</div>
      ${c.motivo ? `<div style="color:var(--tenue)">${esc(c.motivo)}</div>` : ""}
      ${(c.mejora === "baja")
        ? `<div style="color:var(--tenue)">En este indicador, bajar es mejorar: la tendencia se califica al revés.</div>`
        : ""}
      <div class="cita">Fuente del umbral: ${esc(c.fuente)}</div>
    </div></details>`;
}

function barraDimension(d){
  if(!d.evaluable){
    return `<div class="dim"><div class="fila1">
      <span>${esc(d.nombre)} <span class="peso">pesa ${num(d.peso, 0)}%</span></span>
      <span class="nota" style="color:var(--tenue)">sin datos</span></div>
      <div class="aporte">${esc(d.motivo)} Su peso se repartió entre las demás dimensiones.</div>
      <div class="criterios">${d.criterios.map(fichaCriterio).join("")}</div></div>`;
  }
  return `<div class="dim">
    <div class="fila1">
      <span>${esc(d.nombre)} <span class="peso">pesa ${num(d.peso, 0)}%</span></span>
      <span class="nota" style="color:${colorNota(d.puntaje)}">${num(d.puntaje, 1)}</span>
    </div>
    <div class="riel"><div class="relleno" style="width:${Math.max(0, Math.min(100, d.puntaje)).toFixed(1)}%;
      background:${colorNota(d.puntaje)}"></div></div>
    <div class="aporte">aporta ${num(d.aporte, 1)} de los ${num(d.puntaje, 1)} × ${num(d.peso, 0)}% que le corresponden</div>
    <div class="criterios">${d.criterios.map(fichaCriterio).join("")}</div>
  </div>`;
}

function anilloPuntaje(p){
  const R = 55, C = 2 * Math.PI * R;
  const avance = Math.max(0, Math.min(100, p)) / 100 * C;
  return `<svg class="anillo" viewBox="0 0 132 132">
    <circle class="pista" cx="66" cy="66" r="${R}"/>
    <circle class="arco" cx="66" cy="66" r="${R}" stroke="${colorNota(p)}"
      stroke-dasharray="${avance.toFixed(1)} ${(C - avance).toFixed(1)}"/>
    <text class="cifra" x="66" y="70" text-anchor="middle">${num(p, 1)}</text>
    <text class="de" x="66" y="86" text-anchor="middle">de 100</text>
  </svg>`;
}

function seccionSalud(a){
  const s = a.salud;
  if(!s || !s.disponible){
    return s ? `<section><div class="regla"><h2>Salud financiera</h2></div>
      <div class="tarjeta"><p class="apagado">${esc(s.motivo)}</p></div></section>` : "";
  }
  const m = s.metodologia;
  return `
  <section>
    <div class="regla"><h2>Salud financiera</h2></div>
    <p class="leyenda">Un solo número, con toda su metodología a la vista. Abra cualquier
      indicador para ver el umbral con el que se comparó, de dónde salió ese umbral y
      en qué punto exacto de la escala cayó esta empresa.</p>
    <div class="tarjeta">
      <p style="margin:0 0 12px;color:var(--suave);font-size:var(--t-pie);max-width:70ch">
        ${esc(m.explicacion)}</p>
      <code class="g-formula" style="display:block;margin-bottom:16px">${esc(m.formula)}</code>
      ${!s.confiable ? `<div class="aviso">${esc(s.advertencia)}</div>` : ""}
      ${s.metodologia.renormalizacion ? `<div class="aviso">Alguna dimensión quedó sin
        datos y su peso se repartió entre las demás. Los porcentajes de abajo son los
        originales; el reparto está anotado en cada una.</div>` : ""}
      <div class="dims">${s.dimensiones.map(barraDimension).join("")}</div>
    </div>
  </section>`;
}

/* 5 — gráficas
   Nota de arquitectura: aquí NO se calcula nada financiero. Todos los números
   vienen ya resueltos del motor de Python; el navegador solo los traduce a
   coordenadas. Es el mismo criterio que se aplicó a la IA: quien calcula es el
   motor, los demás solo representan. */

const C_ORO="#d9a441", C_AZUL="#60a5fa", C_VERDE="#4ade80",
      C_ROJO="#f87171", C_HUESO="#e8eef7";

const buscarInd = (a, cod) => a.indicadores.find(i => i.codigo === cod) || null;
const hay = v => v !== null && v !== undefined;

function marcoSvg(w, h, cuerpo){
  return `<svg class="grafica" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${cuerpo}</svg>`;
}

function tarjetaGrafica(titulo, pie, svg, leyenda){
  const ley = (leyenda && leyenda.length)
    ? `<div class="leyenda-g">${leyenda.map(([n, c]) =>
        `<span><i style="background:${c}"></i>${esc(n)}</span>`).join("")}</div>`
    : "";
  return `<div class="tarjeta"><h3>${esc(titulo)}</h3>
    <p class="pie">${esc(pie)}</p>${svg}${ley}</div>`;
}

// Extremos del eje, con un respiro arriba y el cero siempre dentro del cuadro:
// una barra que no arranca en cero engaña al ojo.
function extremos(valores){
  const v = valores.filter(hay);
  if(!v.length) return [0, 1];
  const min = Math.min(0, ...v), max = Math.max(0, ...v);
  const respiro = ((max - min) || 1) * 0.12;
  return [min - (min < 0 ? respiro : 0), max + respiro];
}

// Convierte un valor en coordenada vertical dentro del área de dibujo.
function escalaY(min, max, arriba, alto){
  const rango = (max - min) || 1;
  return v => arriba + (max - v) / rango * alto;
}

function malla(y, min, max, izq, ancho, dec){
  let out = "";
  for(let k = 0; k <= 4; k++){
    const v = min + (max - min) * k / 4;
    out += `<line class="malla" x1="${izq}" y1="${y(v).toFixed(1)}" x2="${izq + ancho}" y2="${y(v).toFixed(1)}"/>`
         + `<text class="rotulo" x="${izq - 9}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end">${num(v, dec)}</text>`;
  }
  return out;
}

/* 5a — evolución de los márgenes: barras agrupadas por periodo */
function graficaMargenes(a){
  const series = [
    ["margen_bruto",       "Bruto",       C_ORO],
    ["margen_operacional", "Operacional", C_AZUL],
    ["margen_neto",        "Neto",        C_VERDE]
  ].map(([cod, nom, color]) => ({nom: nom, color: color, ind: buscarInd(a, cod)}))
   .filter(s => s.ind && s.ind.disponible);
  if(!series.length) return "";

  const per = a.periodos;
  const W = 560, H = 290, izq = 48, der = 14, arr = 22, aba = 42;
  const ancho = W - izq - der, alto = H - arr - aba;
  const [min, max] = extremos(series.flatMap(s => s.ind.valores));
  const y = escalaY(min, max, arr, alto);
  const anchoGrupo = ancho / per.length;
  const anchoBarra = Math.min(46, (anchoGrupo * 0.74) / series.length);

  let barras = "";
  per.forEach((p, i) => {
    const centro = izq + anchoGrupo * (i + 0.5);
    const x0 = centro - (anchoBarra * series.length) / 2;
    series.forEach((s, j) => {
      const v = s.ind.valores[i], x = x0 + anchoBarra * j, w = anchoBarra - 5;
      if(!hay(v)){
        barras += `<text class="rotulo" x="${(x + w / 2).toFixed(1)}" y="${(y(0) - 7).toFixed(1)}" text-anchor="middle">n/d</text>`;
        return;
      }
      const cima = Math.min(y(v), y(0)), altura = Math.max(1.5, Math.abs(y(v) - y(0)));
      barras += `<rect x="${x.toFixed(1)}" y="${cima.toFixed(1)}" width="${w.toFixed(1)}" height="${altura.toFixed(1)}" fill="${s.color}" rx="2"><title>${esc(s.nom)} ${esc(p)}: ${num(v, 2)}%</title></rect>`
              + `<text class="valor" x="${(x + w / 2).toFixed(1)}" y="${(cima - 6).toFixed(1)}" text-anchor="middle">${num(v, 1)}</text>`;
    });
    barras += `<text class="rotulo" x="${centro.toFixed(1)}" y="${H - aba + 23}" text-anchor="middle">${esc(p)}</text>`;
  });

  return tarjetaGrafica(
    "Evolución de los márgenes",
    "Cuánto de cada 100 pesos vendidos sobrevive en cada escalón del estado de "
      + "resultados. La distancia entre una barra y la siguiente es lo que se "
      + "llevan los costos, los gastos y la deuda.",
    marcoSvg(W, H, malla(y, min, max, izq, ancho, 1)
      + `<line class="eje" x1="${izq}" y1="${y(0).toFixed(1)}" x2="${izq + ancho}" y2="${y(0).toFixed(1)}"/>`
      + barras),
    series.map(s => [s.nom, s.color]));
}

/* 5b — composición del ciclo de caja: cascada del último periodo */
function graficaCiclo(a){
  const partes = ["dias_cartera", "dias_inventario", "dias_proveedores",
                  "ciclo_conversion_efectivo"].map(c => buscarInd(a, c));
  if(partes.some(i => !i)) return "";
  const u = a.periodos.length - 1;
  const v = partes.map(i => i.valores[u]);
  if(v.some(x => !hay(x))) return "";

  // Solo geometría: los cuatro números ya vienen calculados, y el motor define
  // el ciclo como cartera + inventario − proveedores, así que la cascada cierra.
  const pasos = [
    {nom: "Cartera",     delta:  v[0], color: C_AZUL},
    {nom: "Inventario",  delta:  v[1], color: C_ORO},
    {nom: "Proveedores", delta: -v[2], color: C_ROJO}
  ];
  let acum = 0;
  const cajas = pasos.map(p => {
    const desde = acum;
    acum += p.delta;
    return Object.assign({}, p, {desde: desde, hasta: acum});
  });
  cajas.push({nom: "Ciclo", delta: v[3], desde: 0, hasta: v[3], color: C_HUESO, total: true});

  const W = 560, H = 290, izq = 48, der = 14, arr = 22, aba = 42;
  const ancho = W - izq - der, alto = H - arr - aba;
  const [min, max] = extremos(cajas.flatMap(c => [c.desde, c.hasta]));
  const y = escalaY(min, max, arr, alto);
  const paso = ancho / cajas.length;
  const anchoBarra = Math.min(66, paso * 0.58);

  let cuerpo = malla(y, min, max, izq, ancho, 0), previo = null;
  cajas.forEach((c, i) => {
    const cx = izq + paso * (i + 0.5), x = cx - anchoBarra / 2;
    const cima = Math.min(y(c.desde), y(c.hasta));
    const altura = Math.max(2, Math.abs(y(c.desde) - y(c.hasta)));
    if(previo !== null && !c.total)
      cuerpo += `<line class="conector" x1="${(cx - paso + anchoBarra / 2).toFixed(1)}" y1="${previo.toFixed(1)}" x2="${x.toFixed(1)}" y2="${previo.toFixed(1)}"/>`;
    cuerpo += `<rect x="${x.toFixed(1)}" y="${cima.toFixed(1)}" width="${anchoBarra.toFixed(1)}" height="${altura.toFixed(1)}" fill="${c.color}" rx="2"><title>${esc(c.nom)}: ${num(c.delta, 1)} días</title></rect>`
            + `<text class="valor" x="${cx.toFixed(1)}" y="${(cima - 6).toFixed(1)}" text-anchor="middle">${(c.delta > 0 && !c.total) ? "+" : ""}${num(c.delta, 0)}</text>`
            + `<text class="rotulo" x="${cx.toFixed(1)}" y="${H - aba + 23}" text-anchor="middle">${esc(c.nom)}</text>`;
    previo = y(c.hasta);
  });
  cuerpo += `<line class="eje" x1="${izq}" y1="${y(0).toFixed(1)}" x2="${izq + ancho}" y2="${y(0).toFixed(1)}"/>`;

  return tarjetaGrafica(
    "Composición del ciclo de caja · " + a.periodos[u],
    "Días que la plata pasa fuera de la caja. Cobrar e inventariar empujan el ciclo "
      + "hacia arriba; pagarle más tarde al proveedor lo devuelve. El saldo son "
      + num(v[3], 0) + " días de capital de trabajo que alguien tiene que financiar.",
    marcoSvg(W, H, cuerpo),
    [["Cartera", C_AZUL], ["Inventario", C_ORO], ["Proveedores (resta)", C_ROJO],
     ["Ciclo neto", C_HUESO]]);
}

/* 5c — DuPont: qué palanca movió el ROE */
function graficaDupont(a){
  const atr = a.dupont.variacion_por_factor_pct;
  if(!atr) return "";
  const filas = [
    ["margen_neto",              "Margen neto",              C_ORO],
    ["rotacion_activos",         "Rotación de activos",      C_AZUL],
    ["multiplicador_patrimonio", "Multiplicador patrimonio", C_VERDE]
  ].filter(([k]) => hay(atr[k]));
  if(!filas.length) return "";

  const W = 560, H = 240, izq = 178, der = 58, arr = 24, aba = 30;
  const ancho = W - izq - der, alto = H - arr - aba;
  const [min, max] = extremos(filas.map(([k]) => atr[k]));
  const rango = (max - min) || 1;
  const x = v => izq + (v - min) / rango * ancho;
  const carril = alto / filas.length;
  const altoBarra = Math.min(32, carril * 0.56);

  let cuerpo = `<line class="eje" x1="${x(0).toFixed(1)}" y1="${arr - 8}" x2="${x(0).toFixed(1)}" y2="${arr + alto}"/>`;
  filas.forEach(([k, nom, color], i) => {
    const v = atr[k], cy = arr + carril * (i + 0.5);
    const bx = Math.min(x(0), x(v)), bw = Math.max(2, Math.abs(x(v) - x(0)));
    const positivo = v >= 0;
    cuerpo += `<rect x="${bx.toFixed(1)}" y="${(cy - altoBarra / 2).toFixed(1)}" width="${bw.toFixed(1)}" height="${altoBarra}" fill="${color}" rx="2"><title>${esc(nom)}: ${v > 0 ? "+" : ""}${num(v, 2)}%</title></rect>`
            + `<text class="rotulo" x="${izq - 12}" y="${(cy + 4).toFixed(1)}" text-anchor="end">${esc(nom)}</text>`
            + `<text class="valor" x="${(positivo ? bx + bw + 7 : bx - 7).toFixed(1)}" y="${(cy + 4).toFixed(1)}" text-anchor="${positivo ? "start" : "end"}">${v > 0 ? "+" : ""}${num(v, 1)}%</text>`;
  });

  const roe = a.dupont.factores.roe_reconstruido;
  const ini = roe[0], fin = roe[roe.length - 1];
  const pie = (hay(ini) && hay(fin))
    ? "El ROE pasó de " + num(ini, 2) + "% a " + num(fin, 2) + "%. Cada barra dice cuánto "
      + "se movió la palanca que lo explica: si la que crece es la deuda y no el margen, "
      + "la rentabilidad mejoró por riesgo, no por negocio."
    : "Cuánto se movió cada palanca del ROE entre el primer periodo y el último.";

  return tarjetaGrafica("Qué movió la rentabilidad del socio", pie,
    marcoSvg(W, H, cuerpo), filas.map(([, n, c]) => [n, c]));
}

function seccionGraficas(a){
  const gs = [graficaMargenes(a), graficaCiclo(a), graficaDupont(a)].filter(Boolean);
  if(!gs.length) return "";
  return `
  <section>
    <div class="regla"><h2>Panorama visual</h2></div>
    <p class="leyenda">Las mismas cifras de las tablas, dibujadas. Aquí no se calcula
      nada: el navegador solo ubica en coordenadas lo que ya resolvió el motor.
      Pase el cursor sobre cualquier barra para ver el valor exacto.</p>
    <div class="graficas">${gs.join("")}</div>
  </section>`;
}

/* 5 — indicadores */
function seccionIndicadores(a){
  const cats = {};
  a.indicadores.forEach(i => (cats[i.categoria] ||= []).push(i));
  const bloques = Object.entries(cats).map(([cat, lista]) => `
    <h3 style="font-size:14px;color:var(--tenue);text-transform:uppercase;
      letter-spacing:.8px;margin:22px 0 11px">${cat}</h3>
    <div class="rejilla">${lista.map(tarjetaIndicador).join("")}</div>`).join("");
  return `
  <section>
    <div class="regla"><h2>Indicadores</h2></div>
    <p class="leyenda">Activa <em>modo docente</em> arriba para ver la fórmula, los insumos
      y la fuente bibliográfica de cada indicador.</p>
    ${bloques}
  </section>`;
}

function tarjetaIndicador(i){
  const ini = i.valores[0], fin = i.valores[i.valores.length-1];
  const mostrar = v => v===null||v===undefined
      ? '<span class="v nd">no disponible</span>'
      : `<span class="v">${conUnidad(v, i.unidad)}</span>`;
  let delta = "";
  if(ini!=null && fin!=null && i.valores.length>1){
    const d = fin - ini;
    const cls = Math.abs(d) < 1e-9 ? "neutro" : (d>0 ? "sube" : "baja");
    delta = `<span class="delta ${cls}">${d>0?"+":""}${num(d, i.unidad==="monto"?0:2)}</span>`;
  }
  const cuerpo = i.valores.length>1
    ? `${mostrar(ini)}<span class="flecha">→</span>${mostrar(fin)}${delta}`
    : mostrar(fin);
  return `
  <div class="ind">
    <div class="nom">${esc(i.nombre)}${marcaAyuda({
      titulo: i.nombre, texto: i.nota, formula: i.formula, fuente: i.fuente})}</div>
    <div class="valores">${cuerpo}</div>
    <div class="docencia">
      <div class="campo"><b>Fórmula</b><code>${esc(i.formula)}</code></div>
      <div class="campo"><b>Insumos</b>${i.insumos.map(rotulo).join(" · ")}</div>
      ${i.nota ? `<div class="campo"><b>Interpretación</b>${esc(i.nota)}</div>` : ""}
      ${i.fuente ? `<div class="campo"><b>Fuente</b>${esc(i.fuente)}</div>` : ""}
    </div>
  </div>`;
}

// Un proyector de salón lava los negros. La calibración clara no es un tema
// decorativo: es la que se usa al exponer. Se recuerda entre sesiones.

function aplicarCalibracion(modo){
  document.documentElement.dataset.cal = modo;
  const b = $("#btnCalibracion");
  if(b) b.textContent = modo === "proyector" ? "Pantalla" : "Proyector";
  try{ localStorage.setItem("palpito-cal", modo); }catch(e){ /* modo privado */ }
}

(function calibracionInicial(){
  let guardada = null;

// ==========================================================================
// TOOLTIPS
// Lo pidió el profesor dos veces en clase. El contenido no se escribe aquí:
// sale del motor, que ya carga la fórmula, la interpretación y la fuente de
// cada indicador. Un tooltip que repitiera esos textos podría desincronizarse.
// ==========================================================================

let globoActivo = null;

function marcaAyuda(datos){
  const carga = encodeURIComponent(JSON.stringify(datos));
  return `<button type="button" class="ayuda" data-ayuda="${carga}"
    aria-label="Qué significa ${esc(datos.titulo)}">?</button>`;
}

function cerrarGlobo(){
  if(!globoActivo) return;
  globoActivo.classList.remove("visible");
  const g = globoActivo;
  globoActivo = null;
  setTimeout(() => g.remove(), 160);
}

function abrirGlobo(boton){
  cerrarGlobo();
  let d;
  try{ d = JSON.parse(decodeURIComponent(boton.dataset.ayuda)); }
  catch(e){ return; }

  const g = document.createElement("div");
  g.className = "globo";
  g.setAttribute("role", "tooltip");
  g.innerHTML = `
    <span class="g-tit">${esc(d.titulo)}</span>
    ${d.texto ? esc(d.texto) : ""}
    ${d.formula ? `<code class="g-formula">${esc(d.formula)}</code>` : ""}
    ${d.criterio ? `<div class="g-criterio"><b>Criterio:</b> ${esc(d.criterio)}</div>` : ""}
    ${d.fuente ? `<div class="g-fuente">${esc(d.fuente)}</div>` : ""}`;
  document.body.appendChild(g);

  // Se ubica midiendo el globo ya renderizado: así nunca se sale de la pantalla.
  const r = boton.getBoundingClientRect();
  const caja = g.getBoundingClientRect();
  const margen = 10;
  let x = r.left + r.width / 2 - caja.width / 2;
  x = Math.max(margen, Math.min(x, window.innerWidth - caja.width - margen));
  let y = r.bottom + 8;
  if(y + caja.height > window.innerHeight - margen) y = r.top - caja.height - 8;
  g.style.left = `${Math.round(x)}px`;
  g.style.top  = `${Math.round(Math.max(margen, y))}px`;

  requestAnimationFrame(() => g.classList.add("visible"));
  globoActivo = g;
}

document.addEventListener("pointerover", e => {
  const b = e.target.closest?.(".ayuda");
  if(b) abrirGlobo(b);
});
document.addEventListener("pointerout", e => {
  if(e.target.closest?.(".ayuda")) cerrarGlobo();
});
document.addEventListener("focusin", e => {
  const b = e.target.closest?.(".ayuda");
  if(b) abrirGlobo(b);
});
document.addEventListener("focusout", e => {
  if(e.target.closest?.(".ayuda")) cerrarGlobo();
});
// En pantalla táctil no hay hover: el toque abre y el siguiente toque cierra.
document.addEventListener("click", e => {
  const b = e.target.closest?.(".ayuda");
  if(b){ e.preventDefault(); globoActivo ? cerrarGlobo() : abrirGlobo(b); }
  else cerrarGlobo();
});
document.addEventListener("keydown", e => { if(e.key === "Escape") cerrarGlobo(); });
window.addEventListener("scroll", cerrarGlobo, {passive:true});
window.addEventListener("resize", cerrarGlobo);

// ==========================================================================
// EL MEDIDOR
// La aguja del instrumento sobre su escala calibrada. Reemplaza el anillo:
// un arco de 180 grados con marcas cada 10 puntos se lee de un vistazo desde
// el fondo de un salón, que es donde esto se va a mirar.
// ==========================================================================

function medidorPuntaje(p){
  const cx = 103, cy = 108, R = 78;
  const val = Math.max(0, Math.min(100, p));
  const punto = (frac, radio) => {
    const ang = Math.PI * (1 - frac);            // 180 grados (izq) -> 0 (der)
    return [cx + radio * Math.cos(ang), cy - radio * Math.sin(ang)];
  };
  const [fx, fy] = punto(1, R);

  // Marcas de la escala, cada 10 puntos y mas largas cada 25.
  let marcas = "";
  for(let i = 0; i <= 10; i++){
    const mayor = i % 2.5 === 0;
    const [ax, ay] = punto(i / 10, R + 5);
    const [bx, by] = punto(i / 10, R + (mayor ? 12 : 9));
    marcas += `<line class="marca ${mayor ? "mayor" : ""}" x1="${ax.toFixed(1)}"
      y1="${ay.toFixed(1)}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}"/>`;
  }

  // El valor se marca SOBRE el arco, no con una aguja desde el centro:
  // asi el centro queda libre para la cifra, que es lo que se lee de lejos.
  const [mx, my] = punto(val / 100, R);
  const largo = Math.PI * R;
  const avance = (val / 100) * largo;
  const color = colorNota(val);

  return `<svg class="medidor" viewBox="0 0 206 126" role="img"
      aria-label="Puntaje de salud: ${num(val,1)} sobre 100">
    ${marcas}
    <path class="arco-pista" d="M ${cx - R} ${cy} A ${R} ${R} 0 0 1 ${fx.toFixed(1)} ${fy.toFixed(1)}"/>
    <path class="arco-vivo" d="M ${cx - R} ${cy} A ${R} ${R} 0 0 1 ${fx.toFixed(1)} ${fy.toFixed(1)}"
      stroke="${color}" stroke-dasharray="${largo.toFixed(1)}"
      stroke-dashoffset="${(largo - avance).toFixed(1)}"/>
    <circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="6.5" fill="var(--fondo)"/>
    <circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="4" fill="${color}"/>
    <text class="cifra" x="${cx}" y="${cy - 30}" text-anchor="middle">${num(val, 1)}</text>
    <text class="de" x="${cx}" y="${cy - 15}" text-anchor="middle">de 100</text>
    <text class="rot" x="${cx - R}" y="${cy + 12}" text-anchor="middle">0</text>
    <text class="rot" x="${fx.toFixed(1)}" y="${cy + 12}" text-anchor="middle">100</text>
  </svg>`;
}

// Qué le pasa a la empresa, dicho con lo que el motor ya resolvio.
// No calcula nada: ordena dimensiones que ya vienen con su nota.
function lecturaDictamen(a){
  const s = a.salud;
  const dims = (s.dimensiones || []).filter(d => d.evaluable && d.puntaje != null);
  if(!dims.length) return s.metodologia.explicacion;
  const orden = [...dims].sort((x, y) => x.puntaje - y.puntaje);
  const floja = orden[0], fuerte = orden[orden.length - 1];
  const alertas = (a.alertas || []).length;
  let f = `Su punto más débil es <b>${esc(floja.nombre.toLowerCase())}</b>, `
        + `con ${num(floja.puntaje, 1)} sobre 100`;
  if(fuerte !== floja)
    f += `; el más sólido es <b>${esc(fuerte.nombre.toLowerCase())}</b>, con ${num(fuerte.puntaje, 1)}`;
  f += ". ";
  f += alertas
    ? `El diagnóstico levantó ${alertas} ${alertas === 1 ? "alerta" : "alertas"}.`
    : "El diagnóstico no levantó alertas.";
  return f;
}

// El dictamen: el veredicto de arriba, antes de cualquier detalle.
function bloqueDictamen(a){
  const s = a.salud;
  if(!s || !s.disponible) return "";
  const sem = a.validacion.semaforo;
  const banda = sem === "rojo" ? "rojo" : (s.confiable ? "verde" : "amarillo");
  return `
  <div class="dictamen reticula">
    <div class="veredicto">
      <div class="rotulo">Dictamen</div>
      <p class="banda ${banda}">${esc(s.banda.nombre)}</p>
      <div class="rango-banda">Banda ${esc(s.banda.rango)} puntos</div>
      <p>${lecturaDictamen(a)}</p>
      ${!s.confiable
        ? `<div class="sello-confianza">Puntaje no confiable · ver calidad de los datos</div>`
        : ""}
    </div>
    <div class="aguja-caja">${medidorPuntaje(s.puntaje)}</div>
  </div>`;
}

function valorMetrica(m){
  if(m.valor === null || m.valor === undefined)
    return '<div class="m-val nd">no disponible</div>';
  let t;
  if(m.unidad === "porcentaje")   t = `${num(m.valor * 100, 2)}%`;
  else if(m.unidad === "anios")   t = `${num(m.valor, 2)} años`;
  else if(m.unidad === "veces")   t = num(m.valor, 2);
  else                            t = num(m.valor, 1);
  return `<div class="m-val">${t}</div>`;
}

// Marca del dictamen del proyecto. Icono dibujado, no un glifo de texto.
function marcaVeredicto(sem){

              : sem === "rojo"   ? "M5 5l14 14M19 5L5 19"
              : "M12 4v11M12 19v.5";

              : sem === "rojo"  ? "var(--tinta-mal)" : "var(--tinta-ojo)";
  return `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2.2"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="${trazo}"/></svg>`;

async function evaluarProyecto(){
  const p = leerProyecto();
  if(p.inversion <= 0 || !p.flujos.length){
    $("#proResultado").innerHTML =
      `<p class="apagado">Indique una inversión mayor a cero y al menos un flujo.</p>`;
    return;
  }
  const btn = $("#btnEvaluarPro");
  btn.disabled = true; btn.textContent = "Calculando…";
  try{
    const r = await fetch("/api/proyecto/evaluar", {
      method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(p)});
    if(!r.ok) throw new Error((await r.json()).detail || "No se pudo evaluar");
    pintarProyecto(await r.json());
  }catch(e){
    $("#proResultado").innerHTML = `<p class="apagado">${esc(String(e.message || e))}</p>`;
  }finally{
    btn.disabled = false; btn.textContent = "Evaluar proyecto";
  }
}

async function narrarProyecto(){
  const destino = $("#proNarrativa");
  if(!destino){
    await evaluarProyecto();
    if(!$("#proNarrativa")) return;
  }
  const caja = $("#proNarrativa");
  caja.innerHTML = `<div class="tarjeta ia" style="margin-top:18px">
    <p class="apagado">Redactando el concepto…</p></div>`;
  try{
    const r = await fetch("/api/proyecto/narrar", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify(leerProyecto())});
    const d = await r.json();
    caja.innerHTML = `<div class="tarjeta ia" style="margin-top:18px">
      <div class="regla"><h3 style="margin:0;font-size:var(--t-medio)">Concepto de viabilidad</h3></div>
      ${d.disponible
        ? `<div class="prosa">${md(d.texto)}</div>${sello(d.modelo)}`
        : `<p class="apagado">${esc(d.motivo || "La IA no está disponible.")}
           La evaluación numérica de arriba no depende de ella.</p>`}
    </div>`;
  }catch(e){
    caja.innerHTML = `<div class="tarjeta ia" style="margin-top:18px">
      <p class="apagado">No se pudo redactar el concepto: ${esc(String(e.message || e))}</p></div>`;
  }
}


// ==========================================================================
// FLUJO DE CAJA MENSUAL A 12 MESES
// Sesion 6: un proyecto puede tener VPN positivo y aun asi quebrar la empresa
// si la caja se agota a mitad de anio. Esto detecta ese descalce.
// Los valores que trae cargados son el caso que el profesor puso en clase:
// operacion sana con un CAPEX en marzo que descalza el ano.
// ==========================================================================

const MESES_NOMBRE = ["Enero","Febrero","Marzo","Abril","Mayo","Junio",
  "Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

const MENSUAL_INICIAL = {
  saldo: 150,
  recaudos: [420,430,410,440,450,430,420,440,460,470,480,500],
  egresos:  [407,412,405,415,420,410,408,418,425,430,440,455],
  capex:    [0,0,600,0,0,0,0,0,0,0,0,0]
};

function seccionMensual(){
  return `
    <div class="regla" style="margin-top:34px">
      <h3 style="margin:0;font-size:var(--t-medio)">Flujo de caja a 12 meses</h3>
    </div>
    <p class="pro-lectura">Un proyecto rentable puede quebrar la empresa si la caja
      se agota a mitad de año. Aquí se ve mes a mes: el saldo final de uno es el
      inicial del siguiente.</p>
    <div class="tarjeta">
      <div class="pro-entrada" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
        <label>Saldo inicial de caja
          <input type="number" step="any" id="mesSaldo" value="${MENSUAL_INICIAL.saldo}">
        </label>
      </div>
      <div class="desplazable">
        <table class="mensual-edit">
          <thead><tr><th>Mes</th><th>Recaudos</th><th>Egresos</th><th>CAPEX</th></tr></thead>
          <tbody id="mesCuerpo"></tbody>
        </table>
      </div>
      <div class="imp-acciones">
        <button class="primario" id="btnMensual">Calcular el año</button>
      </div>
    </div>
    <div id="mesResultado"></div>`;
}

function pintarFilasMes(){
  $("#mesCuerpo").innerHTML = MESES_NOMBRE.map((n, i) => `
    <tr>
      <td>${n}</td>
      <td><input type="number" step="any" class="m-in" data-c="recaudos" data-i="${i}"
          value="${MENSUAL_INICIAL.recaudos[i]}"></td>
      <td><input type="number" step="any" class="m-in" data-c="egresos" data-i="${i}"
          value="${MENSUAL_INICIAL.egresos[i]}"></td>
      <td><input type="number" step="any" class="m-in" data-c="capex" data-i="${i}"
          value="${MENSUAL_INICIAL.capex[i]}"></td>
    </tr>`).join("");
}

function leerMensual(){
  const v = c => [...document.querySelectorAll(`.m-in[data-c="${c}"]`)]
                   .map(i => parseFloat(i.value) || 0);
  const rec = v("recaudos"), egr = v("egresos"), cap = v("capex");
  return {
    saldo_inicial: parseFloat($("#mesSaldo").value) || 0,
    meses: MESES_NOMBRE.map((n, i) => ({
      mes: n,
      entradas: {recaudos: rec[i]},
      salidas: {egresos: egr[i], capex: cap[i]}
    }))
  };
}

function pintarMensual(r){
  // Escala comun para las barras: el mes de mayor movimiento marca el tope.
  const tope = Math.max(...r.meses.map(m => Math.abs(m.saldo_final)), 1);
  const filas = r.meses.map(m => {
    const ancho = Math.min(100, Math.abs(m.saldo_final) / tope * 100);
    const color = m.deficit ? "var(--tinta-mal)" : "var(--tinta-bien)";
    return `
    <tr class="${m.deficit ? "mes-neg" : ""}">
      <td>${esc(m.mes)}</td>
      <td class="num">${m.saldo_inicial < 0 ? `(${num(Math.abs(m.saldo_inicial), 0)})`
                                            : num(m.saldo_inicial, 0)}</td>
      <td class="num">${num(m.total_entradas, 0)}</td>
      <td class="num">${num(m.total_salidas, 0)}</td>
      <td class="num">${m.flujo_neto < 0 ? `(${num(Math.abs(m.flujo_neto), 0)})`
                                         : num(m.flujo_neto, 0)}</td>
      <td class="num">${m.saldo_final < 0 ? `(${num(Math.abs(m.saldo_final), 0)})`
                                          : num(m.saldo_final, 0)}</td>
      <td><div class="barra-caja"><i style="width:${ancho.toFixed(0)}%;background:${color}"></i></div></td>
    </tr>`;
  }).join("");

  $("#mesResultado").innerHTML = `
    <div class="pro-veredicto ${r.hay_deficit ? "rojo" : "verde"}" style="margin-top:18px">
      <div class="marca-v">${marcaVeredicto(r.hay_deficit ? "rojo" : "verde")}</div>
      <div class="texto-v">
        <p class="titulo-v">${r.hay_deficit ? "La caja se agota" : "La caja aguanta el año"}</p>
        <p>${esc(r.lectura)}</p>
        ${r.hay_deficit ? `<div class="cuenta">Meses en déficit:
          ${r.meses_en_deficit.map(esc).join(" · ")}</div>` : ""}
      </div>
    </div>
    <div class="desplazable" style="margin-top:14px"><table class="mensual">
      <thead><tr><th>Mes</th><th>Saldo inicial</th><th>Entradas</th><th>Salidas</th>
        <th>Flujo neto</th><th>Saldo final</th><th>Caja</th></tr></thead>
      <tbody>${filas}</tbody>
    </table></div>`;
}

async function calcularMensual(){
  const btn = $("#btnMensual");
  btn.disabled = true; btn.textContent = "Calculando…";
  try{
    const r = await fetch("/api/proyecto/flujo-mensual", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify(leerMensual())});
    if(!r.ok) throw new Error((await r.json()).detail || "No se pudo calcular");
    pintarMensual(await r.json());
  }catch(e){
    $("#mesResultado").innerHTML = `<p class="apagado">${esc(String(e.message || e))}</p>`;
  }finally{
    btn.disabled = false; btn.textContent = "Calcular el año";
  }
}

function conectarMensual(){
  if(!$("#mesCuerpo")) return;
  pintarFilasMes();
  $("#btnMensual").addEventListener("click", calcularMensual);
  calcularMensual();
}

function conectarProyecto(){
  if(!$("#proTira")) return;
  pintarTira(PROYECTO_INICIAL.flujos);
  $("#btnEvaluarPro").addEventListener("click", evaluarProyecto);
  $("#btnNarrarPro").addEventListener("click", narrarProyecto);
  $("#proMas").addEventListener("click", () => {
    const f = [...document.querySelectorAll("#proTira .flujo")].map(i => parseFloat(i.value) || 0);
    if(f.length < 30){ f.push(0); pintarTira(f); }
  });
  $("#proMenos").addEventListener("click", () => {
    const f = [...document.querySelectorAll("#proTira .flujo")].map(i => parseFloat(i.value) || 0);
    if(f.length > 1){ f.pop(); pintarTira(f); }
  });
  // Abre ya evaluada: una seccion en blanco con un boton no ensena nada,
  // y al exponer conviene que el resultado este a la vista sin un clic previo.
  evaluarProyecto();
  conectarMensual();
}


// ==========================================================================
// MÓDULOS
// La aplicación era una sola página larga: para llegar al proyecto había que
// hacer scroll por todo el diagnóstico. Al exponer eso cuesta caro, porque el
// orden de la presentación lo impone la página y no quien habla.
//
// Cada módulo agrupa secciones que ya existían; ninguna cambió por dentro.
// ==========================================================================

const MODULOS = [
  {
    id: "dictamen",
    nombre: "Dictamen",
    resumen: "El veredicto y la calidad de los datos que lo sostienen",
    arma: a => bloqueDictamen(a) + seccionCalidad(a) + seccionIA(),
  },
  {
    id: "salud",
    nombre: "Salud financiera",
    resumen: "El puntaje de 0 a 100, abierto criterio por criterio",
    arma: a => seccionSalud(a),
  },
  {
    id: "indicadores",
    nombre: "Indicadores",
    resumen: "Los 33 indicadores con su fórmula y su fuente",
    arma: a => seccionIndicadores(a) + seccionHorizontal(a),
  },
  {
    id: "diagnostico",
    nombre: "Diagnóstico",
    resumen: "Las alertas, sus causas y qué hacer",
    arma: a => seccionDiagnostico(a) + seccionPuente(a) + seccionDupont(a),
  },
  {
    id: "graficas",
    nombre: "Panorama visual",
    resumen: "Márgenes, ciclo de caja y DuPont",
    arma: a => seccionGraficas(a),
  },
  {
    id: "benchmark",
    nombre: "Benchmark sectorial",
    resumen: "Cómo se ve la empresa frente a su sector",
    arma: a => seccionBenchmark(a),
  },
  {
    id: "proyecto",
    nombre: "Proyecto de inversión",
    resumen: "VPN, TIR, payback y flujo de caja a 12 meses",
    // seccionProyecto YA termina con seccionMensual: sumarla aquí pintaba el
    // flujo a 12 meses DOS VECES, el segundo con la tabla en blanco debajo del
    // resultado del primero.
    arma: () => seccionProyecto(),
  },
];

let moduloActivo = "dictamen";

function pintarNavegacion(){
  const nav = $("#navModulos");
  if(!nav) return;
  nav.innerHTML = MODULOS.map(m => `
    <button type="button" class="nav-item ${m.id === moduloActivo ? "activo" : ""}"
      data-modulo="${m.id}" aria-current="${m.id === moduloActivo ? "page" : "false"}">
      <span class="nav-nom">${esc(m.nombre)}</span>
      <span class="nav-res">${esc(m.resumen)}</span>
    </button>`).join("");
}

function irA(id, {recordar = true} = {}){
  const m = MODULOS.find(x => x.id === id);
  if(!m || !analisis) return;
  moduloActivo = id;
  pintarNavegacion();

  $("#contenido").innerHTML = m.arma(analisis);
  window.scrollTo({top: 0, behavior: "instant"});

  // Cada módulo reconecta solo lo suyo.
  if(id === "dictamen")   conectarIA();
  if(id === "proyecto"){  conectarProyecto(); conectarMensual(); }
  if(id === "benchmark")  conectarBenchmark();

  if(recordar){
    try{ localStorage.setItem("palpito-modulo", id); }catch(e){ /* sin storage */ }
    // El hash deja compartir o recargar cayendo en el mismo módulo.
    history.replaceState(null, "", `#${id}`);
  }
  $("#navLateral")?.classList.remove("abierto");
}

function moduloInicial(){
  const porHash = location.hash.replace("#", "");
  if(MODULOS.some(m => m.id === porHash)) return porHash;
  try{
    const g = localStorage.getItem("palpito-modulo");
    if(MODULOS.some(m => m.id === g)) return g;
  }catch(e){ /* sin storage */ }
  return "dictamen";
}

function conectarNavegacion(){
  $("#navModulos")?.addEventListener("click", e => {
    const b = e.target.closest("[data-modulo]");
    if(b) irA(b.dataset.modulo);
  });
  $("#btnMenu")?.addEventListener("click", () =>
    $("#navLateral")?.classList.toggle("abierto"));
  window.addEventListener("hashchange", () => {
    const id = location.hash.replace("#", "");
    if(id && id !== moduloActivo && MODULOS.some(m => m.id === id))
      irA(id, {recordar: false});
  });
}

// ==========================================================================
// BENCHMARK SECTORIAL
// Las referencias son un dato EXTERNO: no salen de los estados financieros de
// la empresa. Se digitan y se guardan por navegador. El motor no rellena
// ninguna: comparar contra una cifra inventada es peor que no comparar.
// ==========================================================================

let referencias = {};

function cargarReferencias(){
  try{
    referencias = JSON.parse(localStorage.getItem("palpito-benchmark") || "{}");
  }catch(e){ referencias = {}; }
}

function guardarReferencias(){
  try{ localStorage.setItem("palpito-benchmark", JSON.stringify(referencias)); }
  catch(e){ /* sin storage: se pierden al recargar, no es critico */ }
}

function seccionBenchmark(a){
  const cat = a.comparables || [];
  if(!cat.length)
    return `<section><div class="regla"><h2>Benchmark sectorial</h2></div>
      <p class="apagado">No hay indicadores comparables en este caso.</p></section>`;

  const cats = {};
  cat.forEach(c => (cats[c.categoria] ||= []).push(c));

  const bloques = Object.entries(cats).map(([nombre, lista]) => `
    <h3 class="cat-rot">${esc(nombre)}</h3>
    <div class="desplazable"><table class="tabla-bench">
      <thead><tr>
        <th>Indicador</th><th>Empresa</th><th>Sector</th>
        <th>Brecha</th><th>Lectura</th>
      </tr></thead>
      <tbody>${lista.map(c => filaBenchmark(c, a)).join("")}</tbody>
    </table></div>`).join("");

  return `
  <section id="secBenchmark">
    <div class="regla"><h2>Benchmark sectorial</h2></div>
    <p class="leyenda">Digite el valor del sector en la columna <b>Sector</b> y la
      comparación se hace sola. Las casillas que deje vacías no se comparan:
      el motor no inventa una referencia.</p>

    <div class="aviso-fuente">
      <b>De dónde salen estas cifras.</b> No se pueden deducir de los estados
      financieros de la empresa. Escoja abajo una industria y Pálpito carga la
      <b>mediana de ese sector</b>, calculada con los estados que las empresas
      le reportan a la <b>Superintendencia de Sociedades</b>. También puede
      digitarlas a mano; en ese caso anote la fuente para poder sustentarla.
    </div>

    <div class="bench-cabeza">
      <div class="bench-acciones" style="flex-wrap:wrap;gap:8px">
        <label style="display:flex;align-items:center;gap:7px">
          <span class="apagado">Industria</span>
          <select id="benchSector"><option value="">— sin referencias —</option></select>
        </label>
        <input type="text" id="benchFuente" placeholder="Fuente de las referencias"
          value="${esc(referencias.__fuente || "")}">
        <button id="btnLimpiarBench">Borrar referencias</button>
      </div>
      <div class="leyenda" id="benchProcedencia" style="margin:8px 0 0"></div>
      <div class="bench-marcador" id="benchMarcador" style="margin-top:10px"></div>
    </div>
    ${bloques}
  </section>`;
}

function filaBenchmark(c, a){
  const ind = (a.indicadores || []).find(i => i.codigo === c.codigo);
  const valor = ind ? [...ind.valores].reverse().find(v => v !== null) : null;
  const comp = (a.benchmark?.comparaciones || []).find(x => x.codigo === c.codigo);
  // Manda lo digitado en este navegador; si no hay, lo que declare el caso.
  const ref = referencias[c.codigo] ?? comp?.referencia ?? "";
  const flecha = c.mejora === "sube" ? "mayor es mejor"
               : c.mejora === "baja" ? "menor es mejor" : "";
  return `
  <tr data-cod="${c.codigo}">
    <td>
      <div class="b-nom">${esc(c.nombre)}</div>
      ${flecha ? `<div class="b-dir">${flecha}</div>` : ""}
    </td>
    <td class="num">${valor == null ? "—" : conUnidad(valor, c.unidad)}</td>
    <td><input type="number" step="any" class="ref" data-cod="${c.codigo}"
        value="${ref ?? ""}" placeholder="—"></td>
    <td class="num b-brecha">${pintarBrecha(comp)}</td>
    <td class="b-lectura">${comp && comp.veredicto !== "sin_referencia"
        ? esc(comp.lectura) : ""}</td>
  </tr>`;
}

function pintarBrecha(comp){
  if(!comp || comp.brecha == null) return "";
  const cls = comp.veredicto === "favorable" ? "sube"
            : comp.veredicto === "desfavorable" ? "baja" : "neutro";
  const signo = comp.brecha > 0 ? "+" : "";
  const rel = comp.brecha_relativa != null
    ? ` (${signo}${num(comp.brecha_relativa, 1)}%)` : "";
  return `<span class="${cls}">${signo}${num(comp.brecha, 2)}${rel}</span>`;
}

function pintarMarcadorBench(b){
  const m = $("#benchMarcador");
  if(!m) return;
  if(!b || !b.disponible){
    m.innerHTML = `<span class="apagado">Sin referencias declaradas todavía.</span>`;
    return;
  }
  m.innerHTML = `
    <span class="pastilla verde">${b.favorables} mejor</span>
    <span class="pastilla neutra">${b.en_linea} en línea</span>
    <span class="pastilla roja">${b.desfavorables} peor</span>
    <span class="apagado">${b.sin_referencia} sin referencia</span>`;
}

async function recalcularBenchmark(){
  const limpias = {};
  Object.entries(referencias).forEach(([k, v]) => {
    if(k !== "__fuente" && v !== "" && v != null && !Number.isNaN(v)) limpias[k] = v;
  });
  try{
    const r = await fetch("/api/benchmark", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({estados: datosCaso, referencias: limpias})});
    if(!r.ok) return;
    analisis.benchmark = await r.json();
    // Se repintan solo las celdas que cambian, para no perder el foco del
    // campo que la persona está digitando.
    analisis.benchmark.comparaciones.forEach(c => {
      const fila = document.querySelector(`tr[data-cod="${c.codigo}"]`);
      if(!fila) return;
      fila.querySelector(".b-brecha").innerHTML = pintarBrecha(c);
      fila.querySelector(".b-lectura").textContent =
        c.veredicto !== "sin_referencia" ? c.lectura : "";
    });
    pintarMarcadorBench(analisis.benchmark);
  }catch(e){ /* sin red: la tabla queda con lo ultimo calculado */ }
}

/* Las referencias del sector ya vienen calculadas en disco
   (referencias/ciiu-XXXX.json, construidas por herramientas/construir_benchmark).
   La aplicación solo las LEE: nunca consulta internet, ni al abrir esta
   pantalla ni el día de una exposición. Reconstruir un sector es un acto
   deliberado que se corre aparte. */
let sectorCargado = null;   // el sector completo, no solo su código

async function llenarSectores(){
  const sel = $("#benchSector");
  if(!sel) return;
  try{
    const lista = await (await fetch("/api/sectores")).json();
    if(!lista.length){
      $("#benchProcedencia").innerHTML =
        `<span class="apagado">No hay sectores calculados todavía. Se construyen con
         <code>python -m herramientas.construir_benchmark &lt;CIIU&gt; &lt;año&gt;</code>.</span>`;
      return;
    }
    sel.innerHTML = `<option value="">— sin referencias —</option>` +
      lista.map(s => `<option value="${esc(s.ciiu)}">CIIU ${esc(s.ciiu)} · ${esc(s.nombre || "sector")}</option>`).join("");
    if(sectorCargado) sel.value = sectorCargado.ciiu;
  }catch(e){ /* sin servidor: el desplegable queda vacío y se digita a mano */ }
}

/* Se repinta al conectar la sección porque cargar un sector la vuelve a
   dibujar entera, y si no, el texto de procedencia se perdería justo después
   de escribirlo. */
function pintarProcedencia(){
  const proc = $("#benchProcedencia");
  if(!proc || !sectorCargado) return;
  const s = sectorCargado;
  proc.innerHTML =
    `Mediana de <b>${s.empresas_usadas} empresas</b> del CIIU ${esc(s.ciiu)},
     corte <b>${s.anio}</b>. Fuente: Superintendencia de Sociedades, vía
     datos.gov.co (descargado el ${esc(s.descargado || "")}).`;
}

async function cargarSector(ciiu){
  if(!ciiu){
    sectorCargado = null;
    const proc = $("#benchProcedencia");
    if(proc) proc.innerHTML = "";
    return;
  }
  try{
    const r = await fetch(`/api/sectores/${encodeURIComponent(ciiu)}`);
    if(!r.ok) return;
    const s = await r.json();
    sectorCargado = s;
    /* Se adopta la MEDIANA, no el promedio: en datos financieros siempre hay
       una empresa que vendió un activo, y un promedio no sobrevive a eso. */
    Object.entries(s.benchmark || {}).forEach(([cod, v]) => { referencias[cod] = v; });
    referencias.__fuente = `${s.fuente} CIIU ${s.ciiu}, corte ${s.anio}, ` +
                           `${s.empresas_usadas} empresas.`;
    guardarReferencias();
    irA("benchmark");     // se repinta la tabla con las referencias puestas
  }catch(e){ /* sin red: se queda lo que hubiera */ }
}

function conectarBenchmark(){
  if(!$("#secBenchmark")) return;
  llenarSectores();
  pintarProcedencia();
  $("#benchSector")?.addEventListener("change", e => cargarSector(e.target.value));
  // Las referencias que trae el caso se adoptan como punto de partida
  // editable: si no, se verian en la tabla pero no se podrian cambiar.
  (analisis.benchmark?.comparaciones || []).forEach(c => {
    if(c.referencia != null && referencias[c.codigo] == null)
      referencias[c.codigo] = c.referencia;
  });
  pintarMarcadorBench(analisis.benchmark);

  let temporizador = null;
  $("#secBenchmark").addEventListener("input", e => {
    if(e.target.classList.contains("ref")){
      const v = parseFloat(e.target.value);
      const cod = e.target.dataset.cod;
      if(e.target.value === "" || Number.isNaN(v)) delete referencias[cod];
      else referencias[cod] = v;
      guardarReferencias();
      // Se espera a que deje de escribir: recalcular en cada tecla dispara
      // una peticion por caracter.
      clearTimeout(temporizador);
      temporizador = setTimeout(recalcularBenchmark, 400);
    }
    if(e.target.id === "benchFuente"){
      referencias.__fuente = e.target.value;
      guardarReferencias();
    }
  });

  $("#btnLimpiarBench").addEventListener("click", () => {
    referencias = {};
    sectorCargado = null;   // si no, el desplegable seguiría señalando un sector
    /* Y hay que botar TAMBIÉN el último benchmark calculado. Al repintar, la
       sección readopta como punto de partida las referencias que traiga
       `analisis.benchmark`, así que sin esto el botón borraba las casillas y
       el repintado las volvía a llenar con las mismas cifras. Se notaba poco
       cuando las referencias se digitaban de a una; con un sector entero
       cargado de golpe, el botón parecía sencillamente no servir. */
    analisis.benchmark = null;
    guardarReferencias();
    irA("benchmark");
  });

  if(Object.keys(referencias).some(k => k !== "__fuente")) recalcularBenchmark();
}

// ------------------------------------------------------------------ eventos
$("#btnImprimir").addEventListener("click", imprimir);
conectarNavegacion();
cargarReferencias();
moduloActivo = moduloInicial();

$("#btnCalibracion").addEventListener("click", () =>
  aplicarCalibracion(document.documentElement.dataset.cal === "proyector" ? "pantalla" : "proyector"));

$("#chkDocente").addEventListener("change", e =>
  document.body.classList.toggle("docente", e.target.checked));

$("#btnEditor").addEventListener("click", () => {
  const abierto = $("#editor").classList.toggle("abierto");
  $("#btnRecalcular").style.display = abierto ? "" : "none";
  $("#btnEditor").textContent = abierto ? "Ocultar editor" : "Editar datos";
});

$("#btnImportar").addEventListener("click", () => {
  const abierto = $("#importador").classList.toggle("abierto");
  $("#btnImportar").textContent = abierto ? "Ocultar carga" : "Cargar archivo";
  if(abierto && !$("#zonaSoltar") && !tablaImportada) pintarSoltar("");
});

$("#btnRecalcular").addEventListener("click", async () => {
  leerEditor();
  // Si lo que se editó es una empresa cargada por archivo, la copia guardada
  // se actualiza: devolverse al caso del taller y volver no debe deshacer lo
  // que se acaba de corregir a mano.
  const guardado = casosCargados.get($("#selectorCaso").value);
  if(guardado){
    guardado.datos = structuredClone(datosCaso);
    guardado.empresa = datosCaso.empresa || guardado.empresa;
    pintarSelectorCasos();
    $("#selectorCaso").value = guardado.id;
  }
  await analizar();
});
$("#selectorCaso").addEventListener("change", e => cargarCaso(e.target.value));
$("#btnGuardarCaso").addEventListener("click", guardarCasoActual);
$("#btnBorrarCaso").addEventListener("click", borrarCasoActual);

(async () => {
  try{
    const salud = await (await fetch("/api/salud")).json();
    estadoIA = salud.ia || estadoIA;
  }catch(e){ /* sin conexion: la IA queda apagada */ }
  await cargarListaCasos();
})();
</script>
